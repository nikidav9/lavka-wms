<style>

.tabs{display:flex;gap:24px;border-bottom:1px solid #dfe3e7;overflow:auto;margin-bottom:18px}.tab{white-space:nowrap;padding:11px 1px;color:#59616c;cursor:pointer}.tab.active{color:var(--blue);font-weight:650;border-bottom:2px solid var(--blue)}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:14px}.card,.panel{background:#fff;border:1px solid var(--line);border-radius:11px}.kpi{padding:16px 18px;min-height:104px}.kpiLabel{color:#6e7782;font-size:12px}.kpiValue{font-size:28px;font-weight:760;margin:5px 0}.delta{font-size:12px}.up{color:var(--red)}.good{color:var(--green)}
.grid2{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(320px,.7fr);gap:14px}.panelHead{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line)}.panelTitle{font-weight:700}.panelBody{padding:15px}
.chart{height:218px;position:relative;border-left:1px solid #edf0f2;border-bottom:1px solid #edf0f2;margin:10px 7px 26px 34px}.gridLine{position:absolute;left:0;right:0;border-top:1px dashed #e7eaee}.chart svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}.axisLabels{display:flex;justify-content:space-between;margin:-16px 0 0 34px;color:#8a929d;font-size:10px}.legend{display:flex;gap:14px;font-size:11px;color:#6e7782}.legend span:before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:#3b78eb;margin-right:6px}.legend span:last-child:before{background:#8db0ef}
.reasonRow{display:grid;grid-template-columns:140px 1fr 28px;gap:9px;align-items:center;margin:12px 0;font-size:12px}.bar{height:8px;border-radius:999px;background:#edf0f3;overflow:hidden}.bar i{display:block;height:100%;background:#4b80e7;border-radius:999px}
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.pill{border:0;background:#f0f3f6;padding:7px 10px;border-radius:8px;color:#5f6874}.pill.on{background:var(--blueSoft);color:#215dc5;font-weight:650}.miniSearch{border:1px solid #dde2e8;border-radius:8px;padding:7px 9px;background:#fff}
.tableWrap{overflow:auto}.tbl{width:100%;border-collapse:collapse;min-width:760px}.tbl th{background:#fafbfc;color:#7b8490;font-size:10px;font-weight:650;text-align:left;padding:10px 12px}.tbl td{padding:10px 12px;border-top:1px solid #edf0f2;vertical-align:middle}.tbl tbody tr{cursor:pointer}.tbl tbody tr:hover,.tbl tbody tr.selected{background:#f6f9ff}.prod{display:flex;align-items:center;gap:10px;min-width:190px}.pic{width:42px;height:42px;border-radius:8px;object-fit:cover;background:#eef1f4}.prodName{font-weight:650}.small{font-size:11px;color:#7c8590}.tag{display:inline-flex;align-items:center;padding:4px 7px;border-radius:6px;font-size:11px}.tag.red{background:var(--redSoft);color:#c23d47}.tag.amber{background:var(--amberSoft);color:#9b6108}.tag.green{background:var(--greenSoft);color:#287b4d}.tag.blue{background:var(--blueSoft);color:#285ebf}
.detail{padding:16px}.hero{width:100%;height:168px;object-fit:cover;border-radius:9px;background:#f1f3f5}.detail h2{font-size:18px;margin:13px 0 3px}.kv{display:flex;justify-content:space-between;gap:15px;padding:8px 0;border-bottom:1px solid #edf0f2}.comment{background:#f6f7f9;padding:11px;border-radius:8px;margin-top:12px;font-size:12px}.primary,.secondary,.danger{border-radius:8px;padding:10px 12px;font-weight:650}.primary{border:0;background:var(--blue);color:white}.secondary{border:1px solid #d9dee5;background:white;color:#333}.danger{border:1px solid #edc6c9;background:#fff5f5;color:#b73942}.full{width:100%;margin-top:9px}
.stack{display:grid;gap:12px}.sectionCard{padding:16px}.sectionCard h3{margin:0 0 8px}.metricRow{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.metricMini{background:#f7f8fa;border-radius:9px;padding:12px}.metricMini b{font-size:21px;display:block;margin-top:4px}
.empty{padding:54px 26px;text-align:center;color:#717b86}.empty h2{color:#222;margin-top:0}
.modalBg{display:none;position:fixed;inset:0;background:#15192299;align-items:center;justify-content:center;z-index:80;padding:16px}.modal{width:min(500px,100%);background:#fff;border-radius:13px;box-shadow:0 28px 70px #0003;padding:22px}.modal h2{margin:0 0 14px}.choice{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:16px 0}.choice button{padding:14px;border-radius:9px;background:white;border:1px solid #dbe0e6}.qty{width:100%;border:1px solid #d9dee4;border-radius:8px;padding:10px;margin:8px 0}.mobileOverlay{display:none}
@media(max-width:1100px){.kpis{grid-template-columns:repeat(2,1fr)}.grid2{grid-template-columns:1fr}.detailPanel{display:none}}
@media(max-width:760px){.app{display:block}.sidebar{transform:translateX(-100%);transition:.22s;box-shadow:12px 0 40px #0004}.sidebar.open{transform:translateX(0)}.main{grid-column:auto}.menuBtn{display:grid;place-items:center}.topbar{padding:0 12px;height:58px}.search{display:none}.topRight .role,.topRight .user,.topRight .iconBtn{display:none}.page{padding:17px 12px 32px}.pageHead{display:block}.headActions{margin-top:13px;overflow:auto}.page h1{font-size:24px}.tabs{gap:18px}.kpis{grid-template-columns:1fr 1fr}.kpi{min-height:94px;padding:13px}.kpiValue{font-size:24px}.metricRow{grid-template-columns:1fr}.grid2{display:block}.grid2>.panel{margin-bottom:12px}.mobileOverlay.on{display:block;position:fixed;inset:0;background:#0006;z-index:25}.choice{grid-template-columns:1fr}}
</style>

<body>
<div class="app">
<aside class="sidebar" id="sidebar">
  <div class="brand"><div class="brandMark">⌂</div><span>WMS</span></div>
  <div class="navScroll">
    <div id="nav"></div>
    <div class="kitchen" id="kitchen">
      <div class="kitchenHead" onclick="toggleKitchen()"><span class="ico">🍳</span><span class="navLabel">Моя кухня</span><span class="chev">›</span></div>
      <div class="kitchenSubs">
        <div class="subItem" data-section="Интерфейс повара">Интерфейс повара</div>
        <div class="subItem" data-section="Меню">Меню</div>
        <div class="subItem" data-section="Управление">Управление</div>
      </div>
    </div>
  </div>
  <div class="sideFoot">UI: 72<br>Backend: 1.2<br>a3c9e6d–8b74–0fe1–6e8f03b5ae89<br>© 2023–2026 ООО «ЯНДЕКС»</div>
</aside>
<div class="mobileOverlay" id="mobileOverlay" onclick="closeSidebar()"></div>
<main class="main">
<header class="topbar">
  <button class="menuBtn" onclick="openSidebar()">☰</button>
  <div class="search"><input id="globalSearch" placeholder="Поиск в WMS" onkeydown="if(event.key===\'Enter\')globalLookup(this.value)"></div>
  <div class="topRight">
    <button class="iconBtn" onclick="showHelp()">?</button><button class="iconBtn" onclick="showNotifications()">♢</button>
    <div><div class="role">Директор лавки</div><div class="user">Маршала Василевского, 17</div></div>
    <div class="avatar">ДН</div>
  </div>
</header>
<div class="page" id="page"></div>
</main>
</div>
<div class="modalBg" id="modal"><div class="modal" id="modalBody"></div></div>
<script>
const navItems=[
['Общая информация','⌂'],['Мой ассортимент','▦'],['Мои сотрудники','♙'],['Области хранения','▤'],['Диспетчерская','◫'],['Диспетчерская 2.0','◩'],['Операции','⇄'],['Оборудование склада','⚙'],['Печать','▣'],['Остатки','≡'],['Аналитика','⌁'],['Качество','◇'],['Здоровье','♡'],['Табло','▥'],['Задания','✓'],['Слоты','◷'],['Таблица слотов','▦'],['Курьеры','⌖'],['ТМЦ','□']
];

const products=[
{name:'Бананы',sku:'SKU 104829',img:'https://images.unsplash.com/photo-1603833665858-e61d17a86224?auto=format&fit=crop&w=700&q=85',reason:'Испорченный продукт',complaints:3,status:'Требует проверки',tone:'red',stock:18,order:'№ 248 391',when:'21.09 · 18:42',text:'Бананы потемневшие, внутри мягкие. Несколько штук пришлось выбросить.',repeat:true},
{name:'Молоко 3,2%, 930 мл',sku:'SKU 238104',img:'https://images.unsplash.com/photo-1550583724-b2692b85b150?auto=format&fit=crop&w=700&q=85',reason:'Срок годности',complaints:2,status:'Требует проверки',tone:'red',stock:12,order:'№ 248 344',when:'21.09 · 17:11',text:'До окончания срока остался один день.',repeat:true},
{name:'Филе куриное охлаждённое',sku:'SKU 441027',img:'https://images.unsplash.com/photo-1604503468506-a8da13d82791?auto=format&fit=crop&w=700&q=85',reason:'Испорченный продукт',complaints:2,status:'В работе',tone:'amber',stock:9,order:'№ 248 296',when:'21.09 · 15:54',text:'Неприятный запах после вскрытия упаковки.',repeat:true},
{name:'Томаты розовые',sku:'SKU 330918',img:'https://images.unsplash.com/photo-1561136594-7f68413baa99?auto=format&fit=crop&w=700&q=85',reason:'Переспелый продукт',complaints:1,status:'Новая',tone:'blue',stock:15,order:'№ 248 251',when:'21.09 · 14:37',text:'Слишком мягкие, один томат помят.',repeat:false},
{name:'Огурцы среднеплодные',sku:'SKU 119035',img:'https://images.unsplash.com/photo-1604977042946-1eecc30f269e?auto=format&fit=crop&w=700&q=85',reason:'Качество продукта',complaints:1,status:'Решено',tone:'green',stock:21,order:'№ 248 190',when:'21.09 · 12:08',text:'Огурцы вялые.',repeat:false},
{name:'Йогурт натуральный',sku:'SKU 551903',img:'https://images.unsplash.com/photo-1488477181946-6428a0291777?auto=format&fit=crop&w=700&q=85',reason:'Повреждена упаковка',complaints:1,status:'Решено',tone:'green',stock:14,order:'№ 248 115',when:'20.09 · 21:16',text:'Крышка была повреждена.',repeat:false}
];

let currentSection='Качество';
let qualityTab='Обзор';
let selected=0;
let complaintFilter='Все';
let complaintQuery='';
let productFilter='Все';
let productQuery='';
let genericFilter='Сегодня';

const sidebarEl=document.getElementById('sidebar');
const overlayEl=document.getElementById('mobileOverlay');
const pageEl=document.getElementById('page');
const modalEl=document.getElementById('modal');
const modalBodyEl=document.getElementById('modalBody');

function navRender(){
 document.getElementById('nav').innerHTML=navItems.map(function(x){
   var n=x[0],i=x[1];
   return '<div class="navItem '+(currentSection===n?'active':'')+'" data-section="'+n+'"><span class="ico">'+i+'</span><span class="navLabel">'+n+'</span></div>';
 }).join('');
 document.querySelectorAll('.navItem,.subItem').forEach(function(el){
   el.onclick=function(){
     currentSection=el.dataset.section;
     document.querySelectorAll('.subItem').forEach(function(x){x.classList.remove('active')});
     if(el.classList.contains('subItem'))el.classList.add('active');
     render();
     closeSidebar();
   };
 });
}

function toggleKitchen(){document.getElementById('kitchen').classList.toggle('open')}
function openSidebar(){sidebarEl.classList.add('open');overlayEl.classList.add('on')}
function closeSidebar(){sidebarEl.classList.remove('open');overlayEl.classList.remove('on')}

function showModal(title,body,actions){
 modalEl.style.display='flex';
 modalBodyEl.innerHTML='<h2>'+title+'</h2>'+body+(actions||'<button class="primary full" onclick="closeModal()">Закрыть</button>');
}
function closeModal(){modalEl.style.display='none'}
modalEl.onclick=function(e){if(e.target===modalEl)closeModal()};

function showHelp(){
 showModal('Помощь по WMS','<p>Это интерактивный прототип. Выберите раздел в меню, а внутри «Качества» используйте вкладки, фильтры, строки таблиц и действия по товару.</p>');
}
function showNotifications(){
 showModal('Уведомления','<div class="stack"><div class="card sectionCard"><b>4 товара требуют проверки</b><div class="small">Quality Hub · сейчас</div></div><div class="card sectionCard"><b>2 задания близки к SLA</b><div class="small">Задания · 5 минут назад</div></div></div>');
}
function chooseDate(){showModal('Дата','<p>Выбран период: <b>21.09.2026</b>.</p><button class="secondary full" onclick="closeModal()">Оставить дату</button>')}
function chooseStore(){showModal('Лавка','<p><b>Лавка 312 (Митино)</b><br>ул. Митинская, 36</p><button class="secondary full" onclick="closeModal()">Выбрано</button>')}
function showMapInfo(){showModal('Лавка 312 (Митино)','<p>ул. Митинская, 36</p><p class="small">В прототипе внешняя карта не открывается — адрес отображается здесь.</p>')}
function goHome(){currentSection='Общая информация';render()}
function globalLookup(v){
 var q=(v||'').trim().toLowerCase();
 if(!q)return;
 var nav=navItems.find(function(x){return x[0].toLowerCase().includes(q)});
 if(nav){currentSection=nav[0];render();return}
 var idx=products.findIndex(function(p){return (p.name+' '+p.sku+' '+p.order).toLowerCase().includes(q)});
 if(idx>=0){currentSection='Качество';qualityTab='Жалобы';selected=idx;render();if(window.innerWidth<=1100)showComplaint(idx);return}
 showModal('Поиск','<p>По запросу <b>'+q.replace(/[<>&]/g,'')+'</b> ничего не найдено.</p>');
}

function pageHeader(title,sub){
 sub=sub||'ул. Митинская, 36';
 return '<div class="pageHead"><div class="titleWrap"><button class="backBtn" onclick="goHome()">‹</button><div><h1>'+title+' <span class="work"><span class="dot"></span>Работает</span></h1><div class="storeMeta">'+sub+' · <button class="linkBtn" onclick="showMapInfo()">Открыть на карте</button></div></div></div><div class="headActions"><button class="selectBtn" onclick="chooseDate()">▣ 21.09.2026</button><button class="selectBtn" onclick="chooseStore()">Лавка 312 (Митино) ▾</button></div></div>';
}

function setQualityTab(t){qualityTab=t;render()}
function qualityTabs(){
 var tabs=['Обзор','Жалобы','Товары','Причины','Динамика','Действия'];
 return '<div class="tabs">'+tabs.map(function(t){return '<div class="tab '+(qualityTab===t?'active':'')+'" data-tab="'+t+'" onclick="setQualityTab(this.dataset.tab)">'+t+'</div>'}).join('')+'</div>';
}

function kpis(){
 var d=[
 ['Всего жалоб','24','+33%','up','к предыдущему периоду','Жалобы'],
 ['Товары, требующие проверки','4','+1','up','сегодня','Товары'],
 ['Повторные жалобы','5','+3','up','на те же товары','Жалобы'],
 ['Закрыто в срок','83%','+12 п.п.','good','в течение 24 часов','Динамика']
 ];
 return '<div class="kpis">'+d.map(function(x){return '<div class="card kpi clickableCard" onclick="setQualityTab(\''+x[5]+'\')"><div class="kpiLabel">'+x[0]+'</div><div class="kpiValue">'+x[1]+'</div><div class="delta '+x[3]+'">'+x[2]+' <span class="small">'+x[4]+'</span></div></div>'}).join('')+'</div>';
}

function chartPanel(){
 return '<div class="panel"><div class="panelHead"><span class="panelTitle">Динамика жалоб</span><div class="legend"><span>Все жалобы</span><span>Повторные</span></div></div><div class="panelBody"><div class="chart clickableCard" onclick="setQualityTab(\'Динамика\')"><div class="gridLine" style="top:25%"></div><div class="gridLine" style="top:50%"></div><div class="gridLine" style="top:75%"></div><svg viewBox="0 0 700 218" preserveAspectRatio="none"><path d="M0 174 L100 145 L200 160 L300 100 L400 43 L500 118 L600 77 L700 96" fill="none" stroke="#3b78eb" stroke-width="3"/><path d="M0 195 L100 190 L200 184 L300 175 L400 150 L500 169 L600 157 L700 164" fill="none" stroke="#8db0ef" stroke-width="2"/></svg></div><div class="axisLabels"><span>14.09</span><span>15.09</span><span>16.09</span><span>17.09</span><span>18.09</span><span>19.09</span><span>20.09</span><span>21.09</span></div></div></div>';
}

function reasonsPanel(){
 var rs=[['Испорченный продукт',52,13],['Переспелый / незрелый',17,4],['Срок годности',13,3],['Повреждение упаковки',9,2],['Другое',9,2]];
 return '<div class="panel"><div class="panelHead"><span class="panelTitle">Причины жалоб</span><button class="linkBtn" onclick="setQualityTab(\'Причины\')">Все причины</button></div><div class="panelBody">'+rs.map(function(r){return '<div class="reasonRow clickableCard" onclick="showReason(\''+r[0].replace(/'/g,'')+'\')"><span>'+r[0]+'</span><div class="bar"><i style="width:'+r[1]+'%"></i></div><b>'+r[2]+'</b></div>'}).join('')+'</div></div>';
}
function showReason(reason){showModal('Причина: '+reason,'<p>Показаны обращения этой категории. В рабочей версии здесь будет переход к отфильтрованному списку жалоб.</p>')}

function setComplaintFilter(f){complaintFilter=f;render()}
function setComplaintQuery(v){complaintQuery=v;render()}
function filteredComplaints(){
 var q=complaintQuery.trim().toLowerCase();
 return products.map(function(p,i){return {p:p,i:i}}).filter(function(x){
   var p=x.p;
   var ok=complaintFilter==='Все'||(complaintFilter==='Требуют проверки'&&p.status==='Требует проверки')||(complaintFilter==='Открытые'&&p.status!=='Решено')||(complaintFilter==='Повторные'&&p.repeat);
   var text=(p.name+' '+p.sku+' '+p.order+' '+p.reason).toLowerCase();
   return ok&&(!q||text.includes(q));
 });
}
function complaintsTable(){
 var rows=filteredComplaints();
 var filters=['Все','Требуют проверки','Открытые','Повторные'];

function setProductFilter(f){productFilter=f;render()}
function setProductQuery(v){productQuery=v;render()}
function filteredProducts(){
 var q=productQuery.trim().toLowerCase();
 return products.map(function(p,i){return {p:p,i:i}}).filter(function(x){
   var p=x.p;
   var ok=productFilter==='Все'||(productFilter==='С жалобами'&&p.complaints>0)||(productFilter==='Требуют проверки'&&p.status==='Требует проверки')||(productFilter==='Повторные'&&p.repeat);
   return ok&&(!q||(p.name+' '+p.sku).toLowerCase().includes(q));
 });
}

function actionsView(){

function quality(){

function setGenericFilter(f){genericFilter=f;render()}
function showGenericMetric(title,value){showModal(title,'<p>Текущее значение: <b>'+value+'</b>.</p><p class="small">Демо-данные интерактивного прототипа.</p>')}
function showGenericItem(name,status){showModal(name,'<div class="kv"><span>Статус</span><b>'+status+'</b></div><div class="kv"><span>Обновлено</span><b>Только что</b></div><div class="kv"><span>Ответственный</span><b>Директор лавки</b></div>')}

function generic(name){
 var d=genericPages[name]||[name,[['Активно','—'],['Сегодня','—'],['Статус','Работает']],'Раздел WMS'];
 var metrics=d[1].map(function(m,i){return '<div class="card kpi clickableCard" onclick="showGenericMetric(\''+m[0].replace(/'/g,'')+'\',\''+m[1].replace(/'/g,'')+'\')"><div class="kpiLabel">'+m[0]+'</div><div class="kpiValue">'+m[1]+'</div><div class="small">'+(i===2?'текущий статус':'за текущую смену')+'</div></div>'}).join('');
 var rows=genericFilter==='Сегодня'?
 [['Основной поток','Работает','Только что','Директор лавки'],['Контрольная задача','В работе','5 минут назад','Сотрудник смены'],['Системная проверка','Запланировано','Сегодня','WMS']]:
 [['Основной поток','Работает','Только что','Директор лавки'],['Контрольная задача','В работе','5 минут назад','Сотрудник смены'],['Системная проверка','Запланировано','Сегодня','WMS'],['Архивная задача','Завершено','Вчера','Сотрудник смены']];
 return pageHeader(d[0])+'<div class="kpis">'+metrics+'<div class="card kpi clickableCard" onclick="chooseStore()"><div class="kpiLabel">Лавка</div><div class="kpiValue" style="font-size:19px;margin-top:10px">312</div><div class="small">Митино</div></div></div><div class="panel"><div class="panelHead"><span class="panelTitle">'+d[0]+'</span><div class="toolbar"><button class="pill '+(genericFilter==='Сегодня'?'on':'')+'" onclick="setGenericFilter(\'Сегодня\')">Сегодня</button><button class="pill '+(genericFilter==='Все'?'on':'')+'" onclick="setGenericFilter(\'Все\')">Все</button></div></div><div class="panelBody"><h3 style="margin-top:0">'+d[2]+'</h3><div class="tableWrap"><table class="tbl"><thead><tr><th>ОБЪЕКТ</th><th>СТАТУС</th><th>ОБНОВЛЕНО</th><th>ОТВЕТСТВЕННЫЙ</th></tr></thead><tbody>'+rows.map(function(r){var tone=r[1]==='Работает'||r[1]==='Завершено'?'green':r[1]==='В работе'?'amber':'blue';return '<tr onclick="showGenericItem(\''+r[0]+'\',\''+r[1]+'\')"><td>'+r[0]+'</td><td><span class="tag '+tone+'">'+r[1]+'</span></td><td>'+r[2]+'</td><td>'+r[3]+'</td></tr>'}).join('')+'</tbody></table></div></div></div>';
}

function render(){pageEl.innerHTML=currentSection==='Качество'?quality():generic(currentSection);navRender()}

function openCheck(){
 var p=products[selected];
 modalEl.style.display='flex';
 modalBodyEl.innerHTML='<h2>Проверка товара</h2><div class="prod"><img class="pic" src="'+p.img+'"><div><div class="prodName">'+p.name+'</div><div class="small">'+p.sku+'</div></div></div><div class="comment">'+p.text+'</div><p>Проверьте конкретный товар и выберите результат.</p><div class="choice"><button onclick="good()">С товаром всё в норме</button><button class="danger" onclick="bad()">Товар плохого качества</button></div><button class="secondary full" onclick="closeModal()">Отмена</button>';
}
function good(){
 products[selected].status='Решено';
 products[selected].tone='green';
 modalBodyEl.innerHTML='<h2>Проверка завершена</h2><p>Товар в норме. Остатки не изменяются, пересчёт не требуется.</p><button class="primary full" onclick="closeModal();render()">Готово</button>';
}
function bad(){
 var p=products[selected];
 modalBodyEl.innerHTML='<h2>Сколько единиц плохого качества?</h2><p>'+p.name+' · текущий остаток '+p.stock+' шт.</p><input id="qty" class="qty" type="number" min="1" max="'+p.stock+'" value="1"><button class="primary full" onclick="moveBad()">Продолжить</button><button class="secondary full" onclick="openCheck()">Назад</button>';
}
function moveBad(){
 var p=products[selected];
 var input=document.getElementById('qty');
 var q=Math.max(1,Math.min(p.stock,Number(input.value)||1));
 modalBodyEl.innerHTML='<h2>Переместите товар</h2><div class="comment">Переместите <b>'+q+' шт.</b> в блок списания по действующему процессу.</div><p>После перемещения подтвердите выполнение.</p><button class="primary full" onclick="finishBad('+q+')">Перемещение выполнено</button>';
}
function finishBad(q){
 products[selected].stock=Math.max(0,products[selected].stock-q);
 products[selected].status='Решено';
 products[selected].tone='green';
 modalBodyEl.innerHTML='<h2>Готово</h2><p>Результат проверки зафиксирован. '+q+' шт. перемещены в блок списания.</p><button class="primary full" onclick="closeModal();render()">Закрыть</button>';
}
