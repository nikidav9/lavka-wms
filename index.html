<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8">

<title>Lavka WMS — Quality Hub</title>
<style>
:root{--bg:#f4f6f8;--card:#fff;--line:#e2e6ea;--text:#171b22;--muted:#707985;--blue:#2f6fe4;--blueSoft:#eaf1ff;--green:#2b8a57;--greenSoft:#e9f8ef;--red:#d44b55;--redSoft:#fff0f1;--amber:#a96808;--amberSoft:#fff6df;--side:#20242c;--side2:#2d333d}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font:14px/1.4 Inter,Arial,sans-serif;color:var(--text);background:var(--bg)}button,input,select{font:inherit}button{cursor:pointer}
.app{display:grid;grid-template-columns:252px minmax(0,1fr);min-height:100vh}
.sidebar{position:fixed;inset:0 auto 0 0;width:252px;background:var(--side);color:#cbd1d9;z-index:30;display:flex;flex-direction:column;border-right:1px solid #16191f}
.brand{display:flex;align-items:center;gap:10px;height:62px;padding:0 16px;color:#fff;font-weight:750;font-size:18px;border-bottom:1px solid #323945}
.brandMark{width:28px;height:28px;border-radius:8px;background:#ffd548;color:#111;display:grid;place-items:center;font-size:16px}
.navScroll{overflow:auto;padding:10px 9px 16px;flex:1}.navScroll::-webkit-scrollbar{width:5px}.navScroll::-webkit-scrollbar-thumb{background:#444b56;border-radius:10px}
.navItem,.kitchenHead,.subItem{display:flex;align-items:center;gap:10px;border-radius:8px;padding:8px 10px;margin:1px 0;user-select:none}
.navItem,.kitchenHead{cursor:pointer}.navItem:hover,.kitchenHead:hover,.subItem:hover{background:#292f38;color:white}
.navItem.active{background:#36404f;color:#fff;box-shadow:inset 3px 0 0 #5b8df1}.ico{width:18px;text-align:center;opacity:.9;font-size:13px}.navLabel{flex:1}
.kitchenHead .chev{transition:.2s}.kitchen.open .chev{transform:rotate(90deg)}.kitchenSubs{display:none;margin:2px 0 5px 28px}.kitchen.open .kitchenSubs{display:block}.subItem{cursor:pointer;font-size:13px;color:#aeb6c1;padding:7px 9px}.subItem.active{background:#36404f;color:#fff}
.sideFoot{padding:12px 16px 14px;border-top:1px solid #323945;font-size:10px;color:#737d89;line-height:1.6}
.main{grid-column:2;min-width:0}
.topbar{position:sticky;top:0;z-index:20;height:62px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 24px;gap:16px}
.menuBtn{display:none;border:0;background:#f1f3f5;width:38px;height:38px;border-radius:9px}.search{max-width:420px;flex:1;position:relative}.search input{width:100%;padding:10px 12px 10px 36px;border:1px solid #dde1e6;background:#f6f7f9;border-radius:9px;outline:none}.search:before{content:"⌕";position:absolute;left:13px;top:7px;color:#7c8590;font-size:21px}
.topRight{margin-left:auto;display:flex;align-items:center;gap:14px}.role{font-size:12px;color:#6e7782}.user{font-weight:650}.avatar{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:#e7ecf5;font-weight:700}.iconBtn{border:0;background:transparent;color:#5f6873;font-size:18px;padding:6px}
.page{padding:26px 28px 44px;max-width:1680px;margin:auto}.pageHead{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;margin-bottom:18px}.titleWrap{display:flex;gap:12px;align-items:flex-start}.back{font-size:22px;color:#7b8490;margin-top:2px}.page h1{font-size:28px;margin:0 0 3px;letter-spacing:-.3px}.storeMeta{display:flex;gap:10px;align-items:center;color:#6f7883}.work{display:inline-flex;align-items:center;gap:6px;color:#347f58;font-weight:650;font-size:12px}.dot{width:8px;height:8px;border-radius:50%;background:#39a96b}.headActions{display:flex;gap:8px;align-items:center}.selectBtn{background:#fff;border:1px solid #dce1e7;border-radius:8px;padding:9px 11px;color:#3f4650}
.tabs{display:flex;gap:24px;border-bottom:1px solid #dfe3e7;overflow:auto;margin-bottom:18px}.tab{white-space:nowrap;padding:11px 1px;color:#59616c;cursor:pointer}.tab.active{color:var(--blue);font-weight:650;border-bottom:2px solid var(--blue)}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:14px}.card,.panel{background:#fff;border:1px solid var(--line);border-radius:11px}.kpi{padding:16px 18px;min-height:104px}.kpiLabel{color:#6e7782;font-size:12px}.kpiValue{font-size:28px;font-weight:760;margin:5px 0}.delta{font-size:12px}.up{color:var(--red)}.good{color:var(--green)}
.grid2{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(320px,.7fr);gap:14px}.panelHead{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line)}.panelTitle{font-weight:700}.panelBody{padding:15px}
.chart{height:218px;position:relative;border-left:1px solid #edf0f2;border-bottom:1px solid #edf0f2;margin:10px 7px 26px 34px}.gridLine{position:absolute;left:0;right:0;border-top:1px dashed #e7eaee}.chart svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}.axisLabels{display:flex;justify-content:space-between;margin:-16px 0 0 34px;color:#8a929d;font-size:10px}.legend{display:flex;gap:14px;font-size:11px;color:#6e7782}.legend span:before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:#3b78eb;margin-right:6px}.legend span:last-child:before{background:#8db0ef}
.reasonRow{display:grid;grid-template-columns:140px 1fr 28px;gap:9px;align-items:center;margin:12px 0;font-size:12px}.bar{height:8px;border-radius:999px;background:#edf0f3;overflow:hidden}.bar i{display:block;height:100%;background:#4b80e7;border-radius:999px}
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.pill{border:0;background:#f0f3f6;padding:7px 10px;border-radius:8px;color:#5f6874}.pill.on{background:var(--blueSoft);color:#215dc5;font-weight:650}.miniSearch{border:1px solid #dde2e8;border-radius:8px;padding:7px 9px;background:#fff}
.tableWrap{overflow:auto}.tbl{width:100%;border-collapse:collapse;min-width:760px}.tbl th{background:#fafbfc;color:#7b8490;font-size:10px;font-weight:650;text-align:left;padding:10px 12px}.tbl td{padding:10px 12px;border-top:1px solid #edf0f2;vertical-align:middle}.tbl tbody tr{cursor:pointer}.tbl tbody tr:hover,.tbl tbody tr.selected{background:#f6f9ff}.prod{display:flex;align-items:center;gap:10px;min-width:190px}.pic{width:42px;height:42px;border-radius:8px;object-fit:cover;background:#eef1f4}.prodName{font-weight:650}.small{font-size:11px;color:#7c8590}.tag{display:inline-flex;align-items:center;padding:4px 7px;border-radius:6px;font-size:11px}.tag.red{background:var(--redSoft);color:#c23d47}.tag.amber{background:var(--amberSoft);color:#9b6108}.tag.green{background:var(--greenSoft);color:#287b4d}.tag.blue{background:var(--blueSoft);color:#285ebf}
.detail{padding:16px}.hero{width:100%;height:168px;object-fit:cover;border-radius:9px;background:#f1f3f5}.detail h2{font-size:18px;margin:13px 0 3px}.kv{display:flex;justify-content:space-between;gap:15px;padding:8px 0;border-bottom:1px solid #edf0f2}.comment{background:#f6f7f9;padding:11px;border-radius:8px;margin-top:12px;font-size:12px}.primary,.secondary,.danger{border-radius:8px;padding:10px 12px;font-weight:650}.primary{border:0;background:var(--blue);color:white}.secondary{border:1px solid #d9dee5;background:white;color:#333}.danger{border:1px solid #edc6c9;background:#fff5f5;color:#b73942}.full{width:100%;margin-top:9px}
.stack{display:grid;gap:12px}.sectionCard{padding:16px}.sectionCard h3{margin:0 0 8px}.metricRow{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.metricMini{background:#f7f8fa;border-radius:9px;padding:12px}.metricMini b{font-size:21px;display:block;margin-top:4px}
.empty{padding:54px 26px;text-align:center;color:#717b86}.empty h2{color:#222;margin-top:0}
.modalBg{display:none;position:fixed;inset:0;background:#15192299;align-items:center;justify-content:center;z-index:80;padding:16px}.modal{width:min(500px,100%);background:#fff;border-radius:13px;box-shadow:0 28px 70px #0003;padding:22px}.modal h2{margin:0 0 14px}.choice{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:16px 0}.choice button{padding:14px;border-radius:9px;background:white;border:1px solid #dbe0e6}.qty{width:100%;border:1px solid #d9dee4;border-radius:8px;padding:10px;margin:8px 0}.mobileOverlay{display:none}
@media(max-width:1100px){.kpis{grid-template-columns:repeat(2,1fr)}.grid2{grid-template-columns:1fr}.detailPanel{display:none}}
@media(max-width:760px){.app{display:block}.sidebar{transform:translateX(-100%);transition:.22s;box-shadow:12px 0 40px #0004}.sidebar.open{transform:translateX(0)}.main{grid-column:auto}.menuBtn{display:grid;place-items:center}.topbar{padding:0 12px;height:58px}.search{display:none}.topRight .role,.topRight .user,.topRight .iconBtn{display:none}.page{padding:17px 12px 32px}.pageHead{display:block}.headActions{margin-top:13px;overflow:auto}.page h1{font-size:24px}.tabs{gap:18px}.kpis{grid-template-columns:1fr 1fr}.kpi{min-height:94px;padding:13px}.kpiValue{font-size:24px}.metricRow{grid-template-columns:1fr}.grid2{display:block}.grid2>.panel{margin-bottom:12px}.mobileOverlay.on{display:block;position:fixed;inset:0;background:#0006;z-index:25}.choice{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar" id="sidebar">
  <div class="brand"><div class="brandMark">⌂</div><span>WMS</span></div>
  <div class="navScroll">
    <div id="nav"></div>
    <div class="kitchen" id="kitchen">
      <div class="kitchenHead" onclick="toggleKitchen()"><span class="ico">🍳</span><span class="navLabel">Моя кухня</span><span class="chev">›</span></div>

        <div class="subItem" data-section="Интерфейс повара">Интерфейс повара</div>

</aside>

  </div>
</header>
<div class="page" id="page"></div>
</main>
</div>
<div class="modalBg" id="modal"><div class="modal" id="modalBody"></div></div>
<script>
const navItems=[
['Общая информация','⌂'],['Мой ассортимент','▦'],['Мои сотрудники','♙'],['Области хранения','▤'],['Диспетчерская','◫'],['Диспетчерская 2.0','◩'],['Операции','⇄'],['Оборудование склада','⚙'],['Печать','▣'],['Остатки','≡'],['Аналитика','⌁'],['Качество','◇'],['Здоровье','♡'],['Табло','▥'],['Задания','✓'],['Слоты','◷'],['Таблица слотов','▦'],['Курьеры','⌖'],['ТМЦ','□']
];
const products=[
{name:'Бананы',sku:'SKU 104829',img:'https://images.unsplash.com/photo-1603833665858-e61d17a86224?auto=format&fit=crop&w=700&q=85',reason:'Испорченный продукт',complaints:3,status:'Требует проверки',tone:'red',stock:18,order:'№ 248 391',when:'21.09 · 18:42',text:'Бананы потемневшие, внутри мягкие. Несколько штук пришлось выбросить.',repeat:true},
{name:'Молоко 3,2%, 930 мл',sku:'SKU 238104',img:'https://images.unsplash.com/photo-1550583724-b2692b85b150?auto=format&fit=crop&w=700&q=85',reason:'Срок годности',complaints:2,status:'Требует проверки',tone:'red',stock:12,order:'№ 248 344',when:'21.09 · 17:11',text:'До окончания срока остался один день.',repeat:true},
{name:'Филе куриное охлаждённое',sku:'SKU 441027',img:'https://images.unsplash.com/photo-1604503468506-a8da13d82791?auto=format&fit=crop&w=700&q=85',reason:'Испорченный продукт',complaints:2,status:'В работе',tone:'amber',stock:9,order:'№ 248 296',when:'21.09 · 15:54',text:'Неприятный запах после вскрытия упаковки.',repeat:true},
{name:'Томаты розовые',sku:'SKU 330918',img:'https://images.unsplash.com/photo-1561136594-7f68413baa99?auto=format&fit=crop&w=700&q=85',reason:'Переспелый продукт',complaints:1,status:'Новая',tone:'blue',stock:15,order:'№ 248 251',when:'21.09 · 14:37',text:'Слишком мягкие, один томат помят.',repeat:false},
{name:'Огурцы среднеплодные',sku:'SKU 119035',img:'https://images.unsplash.com/photo-1604977042946-1eecc30f269e?auto=format&fit=crop&w=700&q=85',reason:'Качество продукта',complaints:1,status:'Решено',tone:'green',stock:21,order:'№ 248 190',when:'21.09 · 12:08',text:'Огурцы вялые.',repeat:false},
{name:'Йогурт натуральный',sku:'SKU 551903',img:'https://images.unsplash.com/photo-1488477181946-6428a0291777?auto=format&fit=crop&w=700&q=85',reason:'Повреждена упаковка',complaints:1,status:'Решено',tone:'green',stock:14,order:'№ 248 115',when:'20.09 · 21:16',text:'Крышка была повреждена.',repeat:false}
];
let currentSection='Качество', qualityTab='Обзор', selected=0;
const sidebarEl=document.getElementById('sidebar'), overlayEl=document.getElementById('mobileOverlay'), pageEl=document.getElementById('page'), modalEl=document.getElementById('modal'), modalBodyEl=document.getElementById('modalBody');

function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function navRender(){
 document.getElementById('nav').innerHTML=navItems.map(([n,i])=>'<div class="navItem '+(currentSection===n?'active':'')+'" data-section="'+n+'"><span class="ico">'+i+'</span><span class="navLabel">'+n+'</span></div>').join('');
 document.querySelectorAll('.navItem,.subItem').forEach(el=>el.onclick=()=>{currentSection=el.dataset.section;document.querySelectorAll('.subItem').forEach(x=>x.classList.remove('active'));if(el.classList.contains('subItem'))el.classList.add('active');navRender();render();closeSidebar()});
}
function toggleKitchen(){document.getElementById('kitchen').classList.toggle('open')}
function openSidebar(){sidebarEl.classList.add('open');overlayEl.classList.add('on')}
function closeSidebar(){sidebarEl.classList.remove('open');overlayEl.classList.remove('on')}
function pageHeader(title,sub='ул. Митинская, 36'){
 return '<div class="pageHead"><div class="titleWrap"><span class="back">‹</span><div><h1>'+title+' <span class="work"><span class="dot"></span>Работает</span></h1><div class="storeMeta">'+sub+' · <span style="color:#2f6fe4">Открыть на карте</span></div></div></div><div class="headActions"><button class="selectBtn">▣ 21.09.2026</button><button class="selectBtn">Лавка 312 (Митино) ▾</button></div></div>';
}
function qualityTabs(){
 const tabs=['Обзор','Жалобы','Товары','Лавки','Причины','Динамика','Действия'];
 return '<div class="tabs">'+tabs.map(t=>'<div class="tab '+(qualityTab===t?'active':'')+'" data-tab="'+t+'" onclick="setQualityTab(this.dataset.tab)">'+t+'</div>').join('')+'</div>';
}
function setQualityTab(t){qualityTab=t;render()}
function openProductComplaints(i){selected=i;qualityTab='Жалобы';render()}
function kpis(){
 return '<div class="kpis">'+[
 ['Всего жалоб','24','+33%','up','к предыдущему периоду'],
 ['Товары, требующие проверки','4','+1','up','сегодня'],
 ['Повторные жалобы','5','+3','up','на те же товары'],
 ['Закрыто в срок','83%','+12 п.п.','good','в течение 24 часов']
 ].map(x=>'<div class="card kpi"><div class="kpiLabel">'+x[0]+'</div><div class="kpiValue">'+x[1]+'</div><div class="delta '+x[3]+'">'+x[2]+' <span class="small">'+x[4]+'</span></div></div>').join('')+'</div>';
}
function chartPanel(){
 return '<div class="panel"><div class="panelHead"><span class="panelTitle">Динамика жалоб</span><div class="legend"><span>Все жалобы</span><span>Повторные</span></div></div><div class="panelBody"><div class="chart"><div class="gridLine" style="top:25%"></div><div class="gridLine" style="top:50%"></div><div class="gridLine" style="top:75%"></div><svg viewBox="0 0 700 218" preserveAspectRatio="none"><path d="M0 174 L100 145 L200 160 L300 100 L400 43 L500 118 L600 77 L700 96" fill="none" stroke="#3b78eb" stroke-width="3"/><path d="M0 195 L100 190 L200 184 L300 175 L400 150 L500 169 L600 157 L700 164" fill="none" stroke="#8db0ef" stroke-width="2"/></svg></div><div class="axisLabels"><span>14.09</span><span>15.09</span><span>16.09</span><span>17.09</span><span>18.09</span><span>19.09</span><span>20.09</span><span>21.09</span></div></div></div>';
}
function reasonsPanel(){
 const rs=[['Испорченный продукт',52,13],['Переспелый / незрелый',17,4],['Срок годности',13,3],['Повреждение упаковки',9,2],['Другое',9,2]];
 return '<div class="panel"><div class="panelHead"><span class="panelTitle">Причины жалоб</span><span class="small">7 дней</span></div><div class="panelBody">'+rs.map(r=>'<div class="reasonRow"><span>'+r[0]+'</span><div class="bar"><i style="width:'+r[1]+'%"></i></div><b>'+r[2]+'</b></div>').join('')+'</div></div>';
}
function complaintsTable(){
 return '<div class="panel"><div class="panelHead"><div class="toolbar"><button class="pill on">Все 24</button><button class="pill">Требуют проверки 4</button><button class="pill">Открытые 8</button><button class="pill">Повторные 5</button></div><input class="miniSearch" placeholder="Поиск"></div><div class="tableWrap"><table class="tbl"><thead><tr><th>ДАТА</th><th>ТОВАР</th><th>ЗАКАЗ</th><th>ПРИЧИНА</th><th>ПОВТОР</th><th>СТАТУС</th></tr></thead><tbody>'+products.map((p,i)=>'<tr class="'+(selected===i?'selected':'')+'" onclick="selected='+i+';render()"><td>'+p.when+'</td><td><div class="prod"><img class="pic" src="'+p.img+'"><div><div class="prodName">'+p.name+'</div><div class="small">'+p.sku+'</div></div></div></td><td>'+p.order+'</td><td>'+p.reason+'</td><td>'+(p.repeat?'<span class="tag red">Да</span>':'—')+'</td><td><span class="tag '+p.tone+'">'+p.status+'</span></td></tr>').join('')+'</tbody></table></div></div>';
}
function detailPanel(){
 let p=products[selected];return '<div class="panel detailPanel"><div class="detail"><img class="hero" src="'+p.img+'"><h2>'+p.name+'</h2><div class="small">'+p.sku+'</div><div class="kv"><span>Заказ</span><b>'+p.order+'</b></div><div class="kv"><span>Причина</span><b>'+p.reason+'</b></div><div class="kv"><span>Остаток</span><b>'+p.stock+' шт.</b></div><div class="comment"><b>Комментарий покупателя</b><br>'+p.text+'</div><button class="primary full" onclick="openCheck()">Проверить товар</button><button class="secondary full">Открыть жалобу</button></div></div>';
}
function overview(){
 return kpis()+'<div class="grid2" style="margin-bottom:14px">'+chartPanel()+reasonsPanel()+'</div><div class="grid2">'+complaintsTable()+detailPanel()+'</div>';
}
function productsView(){
 return '<div class="panel"><div class="panelHead"><div class="toolbar"><button class="pill on">Все товары</button><button class="pill">С жалобами 11</button><button class="pill">Требуют проверки 4</button><button class="pill">Повторные 5</button></div><input class="miniSearch" placeholder="SKU или товар"></div><div class="tableWrap"><table class="tbl"><thead><tr><th>ТОВАР</th><th>ОСТАТОК</th><th>ЖАЛОБЫ</th><th>ПОСЛЕДНЯЯ ПРИЧИНА</th><th>СТАТУС</th></tr></thead><tbody>'+products.map((p,i)=>'<tr data-i="'+i+'" onclick="openProductComplaints(Number(this.dataset.i))"><td><div class="prod"><img class="pic" src="'+p.img+'"><div><div class="prodName">'+p.name+'</div><div class="small">'+p.sku+'</div></div></div></td><td>'+p.stock+' шт.</td><td>'+p.complaints+'</td><td>'+p.reason+'</td><td><span class="tag '+p.tone+'">'+p.status+'</span></td></tr>').join('')+'</tbody></table></div></div>';
}
function storesView(){

function openCheck(){

}

function bad(){let p=products[selected];modalBodyEl.innerHTML='<h2>Сколько единиц плохого качества?</h2><p>'+p.name+' · текущий остаток '+p.stock+' шт.</p><input id="qty" class="qty" type="number" min="1" max="'+p.stock+'" value="1"><button class="primary full" onclick="moveBad()">Продолжить</button><button class="secondary full" onclick="openCheck()">Назад</button>'}

function finishBad(q){products[selected].stock=Math.max(0,products[selected].stock-q);products[selected].status='Решено';products[selected].tone='green';modalBodyEl.innerHTML='<h2>Готово</h2><p>Результат проверки зафиксирован. '+q+' шт. перемещены в блок списания.</p><button class="primary full" onclick="closeModal();render()">Закрыть</button>'}
