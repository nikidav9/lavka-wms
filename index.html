<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>WMS · Качество</title>
<style>
:root{
  --bg:#f7f8fa;--surface:#fff;--surface2:#f2f4f7;--line:#e8ebef;--text:#17191d;--muted:#777f8a;
  --blue:#246bfd;--blue2:#edf3ff;--red:#d92d3a;--red2:#fff0f1;--amber:#9a6508;--amber2:#fff7df;
  --green:#22734a;--green2:#ebf8f0;--shadow:0 12px 30px rgba(20,27,40,.08)
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font:14px/1.45 Inter,Arial,sans-serif;color:var(--text);background:var(--bg)}
button,input{font:inherit}
button{cursor:pointer}
a{color:inherit}
.shell{min-height:100vh}
.topbar{
  height:68px;position:sticky;top:0;z-index:30;background:rgba(255,255,255,.94);backdrop-filter:blur(12px);
  border-bottom:1px solid var(--line);display:flex;align-items:center;gap:16px;padding:0 28px
}
.brand{display:flex;align-items:center;gap:10px;min-width:180px}
.brandMark{width:32px;height:32px;border-radius:10px;background:#ffd84a;display:grid;place-items:center;font-weight:800}
.brandText{font-weight:760}.brandText span{color:var(--muted);font-weight:600}
.globalSearch{flex:1;max-width:500px;position:relative}
.globalSearch input{width:100%;height:40px;border:1px solid var(--line);border-radius:10px;background:var(--surface2);padding:0 14px 0 38px;outline:none}
.globalSearch:before{content:"⌕";position:absolute;left:13px;top:6px;font-size:22px;color:#8d95a0}
.globalSearch input:focus{background:#fff;border-color:#a8bce7;box-shadow:0 0 0 3px #eaf1ff}
.topActions{margin-left:auto;display:flex;align-items:center;gap:10px}
.storeBtn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 12px;font-weight:650}
.avatar{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:#edf1f7;font-weight:750}
.page{max-width:1500px;margin:0 auto;padding:26px 28px 48px}
.pageHead{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;margin-bottom:18px}
.eyebrow{font-size:12px;color:#8b939d;font-weight:700;letter-spacing:.04em;text-transform:uppercase}
h1{font-size:30px;line-height:1.15;margin:4px 0 6px;letter-spacing:-.4px}
.sub{color:var(--muted)}
.dateBtn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 12px;color:#4b535e}
.tabs{display:flex;gap:26px;border-bottom:1px solid var(--line);margin-bottom:20px;overflow:auto}
.tab{padding:12px 1px 13px;color:#66707b;white-space:nowrap;cursor:pointer;font-weight:600}
.tab.active{color:#15181d;border-bottom:2px solid #15181d}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:16px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:14px;padding:15px 16px;cursor:pointer;transition:.15s}
.kpi:hover{transform:translateY(-1px);box-shadow:0 8px 18px rgba(28,37,52,.05)}
.kpiLabel{font-size:12px;color:var(--muted);margin-bottom:7px}.kpiValue{font-size:28px;font-weight:780;letter-spacing:-.4px}
.kpiHint{font-size:12px;color:var(--muted);margin-top:4px}.bad{color:var(--red)}.good{color:var(--green)}
.principle{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:16px}
.principle b{font-weight:760}.arrow{color:#a3aab3}
.panel{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden}
.panelHead{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:16px 18px;border-bottom:1px solid var(--line)}
.panelTitle{font-weight:760}.panelSub{font-size:12px;color:var(--muted);margin-top:2px}
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.segment{border:0;background:#f3f5f7;color:#5c6570;border-radius:9px;padding:8px 11px;font-weight:650}
.segment.on{background:#111827;color:#fff}
.searchInput{height:38px;width:280px;border:1px solid var(--line);border-radius:10px;padding:0 12px;background:#fff;outline:none}
.searchInput:focus{border-color:#a8bce7;box-shadow:0 0 0 3px #eaf1ff}
.tableWrap{overflow:auto}
.tbl{width:100%;border-collapse:collapse;min-width:920px}
.tbl th{font-size:10px;letter-spacing:.04em;color:#8a929c;text-align:left;padding:11px 16px;background:#fbfcfd;font-weight:750}
.tbl td{padding:14px 16px;border-top:1px solid #f0f2f4;vertical-align:middle}
.tbl tbody tr{cursor:pointer;transition:.12s}
.tbl tbody tr:hover{background:#fafbfc}
.productCell{display:flex;align-items:center;gap:12px;min-width:0}
.pic{width:44px;height:44px;border-radius:10px;object-fit:cover;background:#f0f2f4;flex:0 0 auto}
.prodName{font-weight:720;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta{font-size:11px;color:var(--muted);margin-top:2px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.badge{display:inline-flex;align-items:center;border-radius:999px;padding:5px 8px;font-size:11px;font-weight:700}
.badge.red{background:var(--red2);color:#b72d39}.badge.amber{background:var(--amber2);color:var(--amber)}.badge.green{background:var(--green2);color:var(--green)}.badge.blue{background:var(--blue2);color:#245ac3}
.source{font-weight:700;color:#2f66c8;text-decoration:none}.source:hover{text-decoration:underline}
.chev{font-size:20px;color:#b0b7c0;text-align:right}
.grid2{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(300px,.65fr);gap:14px}
.panelBody{padding:16px}
.chart{height:240px;position:relative;border-left:1px solid #edf0f2;border-bottom:1px solid #edf0f2;margin:10px 14px 24px 36px}
.chart svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.gridLine{position:absolute;left:0;right:0;border-top:1px dashed #edf0f2}
.axis{display:flex;justify-content:space-between;color:#9aa2ac;font-size:10px;margin:-14px 0 0 36px}
.reason{display:grid;grid-template-columns:155px 1fr 28px;gap:10px;align-items:center;margin:13px 0;font-size:12px}
.bar{height:8px;border-radius:999px;background:#eef1f4;overflow:hidden}.bar i{display:block;height:100%;background:#4a79e8;border-radius:999px}
.empty{padding:48px;text-align:center;color:var(--muted)}
.actionsGrid{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(320px,.65fr);gap:14px}
.actionCard{border:1px solid var(--line);border-radius:12px;padding:14px}
.actionTop{display:flex;justify-content:space-between;gap:10px}
.actionBtns{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.primary,.secondary,.danger{border-radius:10px;padding:10px 13px;font-weight:700}
.primary{border:0;background:#111827;color:#fff}.primary:hover{background:#000}
.secondary{border:1px solid var(--line);background:#fff;color:#303640}.secondary:hover{background:#f7f8fa}
.danger{border:1px solid #f1c5ca;background:#fff7f8;color:#b22b37}
.step{display:flex;gap:10px;padding:11px 0;border-bottom:1px solid #f0f2f4}.step:last-child{border-bottom:0}
.stepNo{width:24px;height:24px;border-radius:50%;background:#eff3f9;display:grid;place-items:center;font-size:11px;font-weight:800;color:#355b9d;flex:0 0 auto}
.drawerBg{display:none;position:fixed;inset:0;background:rgba(20,27,40,.35);z-index:80}
.drawerBg.open{display:block}
.drawer{position:absolute;top:0;right:0;height:100%;width:min(470px,94vw);background:#fff;box-shadow:-20px 0 50px rgba(17,24,39,.15);display:flex;flex-direction:column}
.drawerHead{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:22px;border-bottom:1px solid var(--line)}
.drawerHead h2{font-size:21px;margin:3px 0}
.closeBtn{width:34px;height:34px;border-radius:9px;border:0;background:#f1f3f5;color:#555;font-size:20px}
.drawerBody{padding:20px 22px;overflow:auto}
.factGrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:16px 0}
.fact{background:#f7f8fa;border-radius:10px;padding:11px}.fact span{display:block;font-size:11px;color:var(--muted);margin-bottom:4px}.fact b{font-size:13px}
.comment{background:#f7f8fa;border-radius:10px;padding:12px;margin-top:12px;font-size:13px}
.drawerActions{display:grid;gap:8px;margin-top:16px}
.modalBg{display:none;position:fixed;inset:0;background:rgba(20,27,40,.42);z-index:100;align-items:center;justify-content:center;padding:18px}
.modal{width:min(500px,100%);background:#fff;border-radius:16px;padding:22px;box-shadow:var(--shadow)}
.modal h2{margin:0 0 14px}.choice{display:grid;grid-template-columns:1fr 1fr;gap:10px}.qty{width:100%;height:42px;border:1px solid var(--line);border-radius:10px;padding:0 12px;margin:8px 0}
@media(max-width:1000px){.kpis{grid-template-columns:repeat(2,1fr)}.grid2,.actionsGrid{grid-template-columns:1fr}.topbar{padding:0 16px}.page{padding:20px 16px}.globalSearch{max-width:none}}
@media(max-width:720px){.brand{min-width:auto}.brandText span{display:none}.globalSearch{display:none}.pageHead{display:block}.pageHead .dateBtn{margin-top:12px}.kpis{grid-template-columns:1fr 1fr}.tabs{gap:18px}.choice{grid-template-columns:1fr}.drawer{width:100vw}.searchInput{width:100%}.panelHead{align-items:flex-start;flex-direction:column}}
</style>
</head>
<body>
<div class="shell">
<header class="topbar">
  <div class="brand"><div class="brandMark">W</div><div class="brandText">WMS <span>/ Качество</span></div></div>
  <div class="globalSearch"><input id="globalSearch" placeholder="Найти товар, SKU или заказ" onkeydown="if(event.key==='Enter')globalLookup(this.value)"></div>
  <div class="topActions"><button class="storeBtn" onclick="showStore()">Лавка 312 · Митино</button><div class="avatar">ДН</div></div>
</header>

<main class="page">
  <div class="pageHead">
    <div><div class="eyebrow">Quality Hub</div><h1>Качество</h1><div class="sub">Жалобы покупателей и оперативная проверка товаров</div></div>
    <button class="dateBtn" onclick="showDate()">21.09.2026</button>
  </div>
  <div id="page"></div>
</main>
</div>

<div class="drawerBg" id="drawerBg" onclick="if(event.target===this)closeDrawer()"><aside class="drawer" id="drawer"></aside></div>
<div class="modalBg" id="modal"><div class="modal" id="modalBody"></div></div>

<script>
const products=[
{name:'Бананы',sku:'SKU 104829',img:'https://images.unsplash.com/photo-1603833665858-e61d17a86224?auto=format&fit=crop&w=700&q=85',reason:'Испорченный продукт',complaints:3,status:'Требует проверки',tone:'red',stock:18,order:'№ 248 391',when:'21.09 · 18:42',text:'Бананы потемневшие, внутри мягкие. Несколько штук пришлось выбросить.',repeat:true,sourceId:'QUALITY-248391',sourceUrl:'https://tracker.yandex.ru/QUALITY-248391',priority:'Срочно',scenario:'Срочная проверка',hold:true},
{name:'Молоко 3,2%, 930 мл',sku:'SKU 238104',img:'https://images.unsplash.com/photo-1550583724-b2692b85b150?auto=format&fit=crop&w=700&q=85',reason:'Срок годности',complaints:2,status:'Требует проверки',tone:'red',stock:12,order:'№ 248 344',when:'21.09 · 17:11',text:'До окончания срока остался один день.',repeat:true,sourceId:'QUALITY-248344',sourceUrl:'https://tracker.yandex.ru/QUALITY-248344',priority:'Срочно',scenario:'Срочная проверка',hold:true},
{name:'Филе куриное охлаждённое',sku:'SKU 441027',img:'https://images.unsplash.com/photo-1604503468506-a8da13d82791?auto=format&fit=crop&w=700&q=85',reason:'Испорченный продукт',complaints:2,status:'В работе',tone:'amber',stock:9,order:'№ 248 296',when:'21.09 · 15:54',text:'Неприятный запах после вскрытия упаковки.',repeat:true,sourceId:'QUALITY-248296',sourceUrl:'https://tracker.yandex.ru/QUALITY-248296',priority:'В работе',scenario:'Срочная проверка',hold:true},
{name:'Томаты розовые',sku:'SKU 330918',img:'https://images.unsplash.com/photo-1561136594-7f68413baa99?auto=format&fit=crop&w=700&q=85',reason:'Переспелый продукт',complaints:1,status:'Новая',tone:'blue',stock:15,order:'№ 248 251',when:'21.09 · 14:37',text:'Слишком мягкие, один томат помят.',repeat:false,sourceId:'QUALITY-248251',sourceUrl:'https://tracker.yandex.ru/QUALITY-248251',priority:'Новая',scenario:'Визуальная проверка',hold:false},
{name:'Огурцы среднеплодные',sku:'SKU 119035',img:'https://images.unsplash.com/photo-1604977042946-1eecc30f269e?auto=format&fit=crop&w=700&q=85',reason:'Качество продукта',complaints:1,status:'Решено',tone:'green',stock:21,order:'№ 248 190',when:'21.09 · 12:08',text:'Огурцы вялые.',repeat:false,sourceId:'QUALITY-248190',sourceUrl:'https://tracker.yandex.ru/QUALITY-248190',priority:'Закрыто',scenario:'Визуальная проверка',hold:false},
{name:'Йогурт натуральный',sku:'SKU 551903',img:'https://images.unsplash.com/photo-1488477181946-6428a0291777?auto=format&fit=crop&w=700&q=85',reason:'Повреждена упаковка',complaints:1,status:'Решено',tone:'green',stock:14,order:'№ 248 115',when:'20.09 · 21:16',text:'Крышка была повреждена.',repeat:false,sourceId:'QUALITY-248115',sourceUrl:'https://tracker.yandex.ru/QUALITY-248115',priority:'Закрыто',scenario:'Разбор кейса',hold:false}
];

let tab='Обзор',complaintFilter='Все',complaintQuery='',productFilter='Все',productQuery='',selected=0,pickerTimer=null;
const page=document.getElementById('page'),drawerBg=document.getElementById('drawerBg'),drawer=document.getElementById('drawer'),modal=document.getElementById('modal'),modalBody=document.getElementById('modalBody');

function tabs(){
 const arr=['Обзор','Жалобы','Товары','Причины','Динамика','Действия'];
 return '<div class="tabs">'+arr.map(x=>'<div class="tab '+(tab===x?'active':'')+'" onclick="tab=\''+x+'\';render()">'+x+'</div>').join('')+'</div>';
}
function kpis(){
 const d=[['Всего жалоб','24','за 7 дней','Жалобы'],['Требуют проверки','4','нужна реакция','Товары'],['Повторные жалобы','5','по тем же SKU','Жалобы'],['Закрыто в срок','83%','в течение 24 часов','Динамика']];
 return '<div class="kpis">'+d.map(x=>'<div class="kpi" onclick="tab=\''+x[3]+'\';render()"><div class="kpiLabel">'+x[0]+'</div><div class="kpiValue">'+x[1]+'</div><div class="kpiHint">'+x[2]+'</div></div>').join('')+'</div>';
}
function chart(){
 return '<div class="panel"><div class="panelHead"><div><div class="panelTitle">Динамика жалоб</div><div class="panelSub">Все жалобы и повторные обращения</div></div></div><div class="panelBody"><div class="chart" onclick="tab=\'Динамика\';render()"><div class="gridLine" style="top:25%"></div><div class="gridLine" style="top:50%"></div><div class="gridLine" style="top:75%"></div><svg viewBox="0 0 700 240" preserveAspectRatio="none"><path d="M0 190 L100 155 L200 170 L300 112 L400 48 L500 130 L600 85 L700 102" fill="none" stroke="#2f6fe4" stroke-width="3"/><path d="M0 212 L100 205 L200 198 L300 184 L400 160 L500 178 L600 166 L700 172" fill="none" stroke="#9ab5ec" stroke-width="2"/></svg></div><div class="axis"><span>14.09</span><span>15.09</span><span>16.09</span><span>17.09</span><span>18.09</span><span>19.09</span><span>20.09</span><span>21.09</span></div></div></div>';
}
function reasons(){
 const rs=[['Испорченный продукт',52,13],['Переспелый / незрелый',17,4],['Срок годности',13,3],['Повреждение упаковки',9,2],['Другое',9,2]];
 return '<div class="panel"><div class="panelHead"><div><div class="panelTitle">Причины жалоб</div><div class="panelSub">Распределение за 7 дней</div></div></div><div class="panelBody">'+rs.map(r=>'<div class="reason"><span>'+r[0]+'</span><div class="bar"><i style="width:'+r[1]+'%"></i></div><b>'+r[2]+'</b></div>').join('')+'</div></div>';
}
function filteredComplaints(){
 const q=complaintQuery.trim().toLowerCase();
 return products.map((p,i)=>({p,i})).filter(x=>{
  const p=x.p;
  const ok=complaintFilter==='Все'||(complaintFilter==='Требуют проверки'&&p.status==='Требует проверки')||(complaintFilter==='Открытые'&&p.status!=='Решено')||(complaintFilter==='Повторные'&&p.repeat);
  return ok&&(!q||(p.name+' '+p.sku+' '+p.order+' '+p.reason).toLowerCase().includes(q));
 });
}
function complaints(){
 const rows=filteredComplaints(),filters=['Все','Требуют проверки','Открытые','Повторные'];
 return '<div class="panel"><div class="panelHead"><div><div class="panelTitle">Жалобы по качеству</div><div class="panelSub">'+rows.length+' обращений</div></div><div class="toolbar">'+filters.map(f=>'<button class="segment '+(complaintFilter===f?'on':'')+'" onclick="complaintFilter=\''+f+'\';render()">'+f+'</button>').join('')+'<input class="searchInput" placeholder="Поиск" value="'+complaintQuery.replace(/"/g,'&quot;')+'" onkeydown="if(event.key===\'Enter\'){complaintQuery=this.value;render()}" onblur="complaintQuery=this.value"></div></div><div class="tableWrap"><table class="tbl"><thead><tr><th>ТОВАР</th><th>ПРИЧИНА</th><th>ИСТОЧНИК</th><th>СТАТУС</th><th>ДАТА</th><th></th></tr></thead><tbody>'+rows.map(x=>{const p=x.p,i=x.i;return '<tr onclick="openDrawer('+i+')"><td><div class="productCell"><img class="pic" src="'+p.img+'"><div><div class="prodName">'+p.name+'</div><div class="meta"><span>'+p.sku+'</span><span>•</span><span>'+p.order+'</span>'+(p.repeat?'<span class="badge red">повтор</span>':'')+'</div></div></div></td><td>'+p.reason+'<div class="meta">'+p.scenario+'</div></td><td><a class="source" href="'+p.sourceUrl+'" target="_blank" rel="noopener" onclick="event.stopPropagation()">'+p.sourceId+' ↗</a></td><td><span class="badge '+p.tone+'">'+p.status+'</span></td><td>'+p.when+'</td><td class="chev">›</td></tr>'}).join('')+'</tbody></table></div></div>';
}
function filteredProducts(){
 const q=productQuery.trim().toLowerCase();
 return products.map((p,i)=>({p,i})).filter(x=>{
  const p=x.p;
  const ok=productFilter==='Все'||(productFilter==='С жалобами'&&p.complaints>0)||(productFilter==='Требуют проверки'&&p.status==='Требует проверки')||(productFilter==='Повторные'&&p.repeat);
  return ok&&(!q||(p.name+' '+p.sku).toLowerCase().includes(q));
 });
}
function productsView(){
 const rows=filteredProducts(),filters=['Все','С жалобами','Требуют проверки','Повторные'];
 return '<div class="panel"><div class="panelHead"><div><div class="panelTitle">Товары</div><div class="panelSub">SKU с жалобами и проверками</div></div><div class="toolbar">'+filters.map(f=>'<button class="segment '+(productFilter===f?'on':'')+'" onclick="productFilter=\''+f+'\';render()">'+f+'</button>').join('')+'<input class="searchInput" placeholder="SKU или товар" value="'+productQuery.replace(/"/g,'&quot;')+'" onkeydown="if(event.key===\'Enter\'){productQuery=this.value;render()}" onblur="productQuery=this.value"></div></div><div class="tableWrap"><table class="tbl"><thead><tr><th>ТОВАР</th><th>ОСТАТОК</th><th>ЖАЛОБЫ</th><th>ПОСЛЕДНЯЯ ПРИЧИНА</th><th>СТАТУС</th><th></th></tr></thead><tbody>'+rows.map(x=>{const p=x.p,i=x.i;return '<tr onclick="openDrawer('+i+')"><td><div class="productCell"><img class="pic" src="'+p.img+'"><div><div class="prodName">'+p.name+'</div><div class="meta">'+p.sku+'</div></div></div></td><td>'+p.stock+' шт.</td><td>'+p.complaints+'</td><td>'+p.reason+'</td><td><span class="badge '+p.tone+'">'+p.status+'</span></td><td class="chev">›</td></tr>'}).join('')+'</tbody></table></div></div>';
}
function reasonsView(){
 return '<div class="grid2">'+reasons()+'<div class="panel"><div class="panelHead"><div><div class="panelTitle">Логика реакции</div><div class="panelSub">В зависимости от причины</div></div></div><div class="panelBody"><div class="actionCard"><b>Критичные причины</b><p class="sub">Испорченный продукт и срок годности → срочная проверка конкретного SKU.</p></div><div class="actionCard" style="margin-top:10px"><b>Субъективные причины</b><p class="sub">Зрелость и внешний вид → визуальная проверка без автоматической блокировки.</p></div></div></div></div>';
}
function dynamicsView(){
 return kpis()+'<div class="grid2">'+chart()+'<div class="panel"><div class="panelHead"><div><div class="panelTitle">Повторные жалобы</div><div class="panelSub">Демо-метрики</div></div></div><div class="panelBody"><div class="kpi" onclick="tab=\'Жалобы\';complaintFilter=\'Повторные\';render()"><div class="kpiLabel">После первого сигнала</div><div class="kpiValue">17</div><div class="kpiHint">≈ 16% очищенной выборки</div></div><div class="kpi" style="margin-top:10px"><div class="kpiLabel">Строгий критерий</div><div class="kpiValue">11</div><div class="kpiHint">≈ 10% выборки</div></div></div></div></div>';
}
function actionsView(){
 const ids=[0,1,2,3];
 return '<div class="actionsGrid"><div class="panel"><div class="panelHead"><div><div class="panelTitle">Очередь действий</div><div class="panelSub">Сначала критичные и повторные сигналы</div></div></div><div class="panelBody">'+ids.map(i=>{const p=products[i];return '<div class="actionCard"><div class="actionTop"><div class="productCell"><img class="pic" src="'+p.img+'"><div><div class="prodName">'+p.name+'</div><div class="meta">'+p.sku+' • '+p.order+'</div></div></div><span class="badge '+p.tone+'">'+p.priority+'</span></div><div class="meta" style="margin-top:8px"><span>'+p.reason+'</span><span>•</span><span>'+p.scenario+'</span></div><div class="actionBtns"><button class="primary" onclick="selected='+i+';openCheck()">Проверить товар</button><button class="secondary" onclick="openDrawer('+i+')">Карточка</button></div></div>'}).join('')+'</div></div><div class="panel"><div class="panelHead"><div><div class="panelTitle">Что делает Quality Hub</div><div class="panelSub">После первого сигнала</div></div></div><div class="panelBody">'+[
 ['Сигнал почти в real time','Жалоба попадает в WMS без ручного поиска заказа.'],
 ['Карточка уже обогащена','SKU, причина, заказ, остаток и история в одном месте.'],
 ['Точечная реакция','Hold — только на конкретный SKU, если он нужен.'],
 ['Проверка следующих заказов','Сборщик получает дополнительное предупреждение.'],
 ['Фиксация результата','Хороший товар остаётся как есть; плохой — в существующий процесс списания.']
 ].map((s,i)=>'<div class="step"><span class="stepNo">'+(i+1)+'</span><div><b>'+s[0]+'</b><div class="panelSub">'+s[1]+'</div></div></div>').join('')+'<button class="secondary" style="width:100%;margin-top:12px" onclick="showPickerCheck()">Экран дополнительной проверки сборщика</button></div></div></div>';
}
function overview(){
 return kpis()+'<div class="principle"><b>Первая жалоба</b><span class="arrow">→</span><span>сигнал в WMS</span><span class="arrow">→</span><span>проверка конкретного SKU</span><span class="arrow">→</span><span>меньше повторных обращений</span></div><div class="grid2" style="margin-bottom:14px">'+chart()+reasons()+'</div>'+complaints();
}
function render(){
 let body=tab==='Обзор'?overview():tab==='Жалобы'?complaints():tab==='Товары'?productsView():tab==='Причины'?reasonsView():tab==='Динамика'?dynamicsView():actionsView();
 page.innerHTML=tabs()+body;
}
function openDrawer(i){
 selected=i;const p=products[i];
 drawer.innerHTML='<div class="drawerHead"><div><div class="panelSub">'+p.sourceId+'</div><h2>'+p.name+'</h2><div class="meta">'+p.sku+' • '+p.order+'</div></div><button class="closeBtn" onclick="closeDrawer()">×</button></div><div class="drawerBody"><div style="display:flex;gap:7px;flex-wrap:wrap"><span class="badge '+p.tone+'">'+p.status+'</span>'+(p.repeat?'<span class="badge red">Повторная</span>':'')+'</div><div class="factGrid"><div class="fact"><span>Причина</span><b>'+p.reason+'</b></div><div class="fact"><span>Сценарий</span><b>'+p.scenario+'</b></div><div class="fact"><span>Остаток</span><b>'+p.stock+' шт.</b></div><div class="fact"><span>Время</span><b>'+p.when+'</b></div></div><div class="comment"><b>Комментарий покупателя</b><br>'+p.text+'</div><div class="panelSub" style="margin-top:12px">'+(p.hold?'Quality Hold применяется только к этому SKU до проверки.':'Автоматического Hold нет — нужна визуальная проверка конкретной позиции.')+'</div><div class="drawerActions"><button class="primary" onclick="closeDrawer();openCheck()">Проверить товар</button><a class="secondary" style="text-decoration:none;text-align:center" href="'+p.sourceUrl+'" target="_blank" rel="noopener">Открыть исходную жалобу ↗</a></div></div>';
 drawerBg.classList.add('open');document.body.style.overflow='hidden';
}
function closeDrawer(){drawerBg.classList.remove('open');document.body.style.overflow=''}
function showStore(){showModal('Лавка 312 · Митино','<p>ул. Митинская, 36</p>')}
function showDate(){showModal('Дата','<p>Выбран период: <b>21.09.2026</b></p>')}
function globalLookup(v){
 const q=(v||'').trim().toLowerCase();if(!q)return;
 const i=products.findIndex(p=>(p.name+' '+p.sku+' '+p.order).toLowerCase().includes(q));
 if(i>=0){tab='Жалобы';render();openDrawer(i)} else showModal('Поиск','<p>Ничего не найдено.</p>');
}
function showModal(title,body,actions){
 modal.style.display='flex';modalBody.innerHTML='<h2>'+title+'</h2>'+body+(actions||'<button class="primary" style="width:100%;margin-top:12px" onclick="closeModal()">Закрыть</button>');
}
function closeModal(){modal.style.display='none';if(pickerTimer){clearInterval(pickerTimer);pickerTimer=null}}
modal.onclick=e=>{if(e.target===modal)closeModal()};
function openCheck(){
 const p=products[selected];
 showModal('Проверка товара','<div class="productCell"><img class="pic" src="'+p.img+'"><div><div class="prodName">'+p.name+'</div><div class="meta">'+p.sku+' • '+p.scenario+'</div></div></div><div class="comment">'+p.text+'</div><p>Проверьте конкретный товар и выберите результат.</p><div class="choice"><button class="secondary" onclick="good()">С товаром всё в норме</button><button class="danger" onclick="bad()">Товар плохого качества</button></div>');
}
function good(){products[selected].status='Решено';products[selected].tone='green';showModal('Проверка завершена','<p>Товар в норме. Остатки не изменяются, пересчёт не требуется.</p>')}
function bad(){
 const p=products[selected];showModal('Сколько единиц плохого качества?','<p>'+p.name+' · текущий остаток '+p.stock+' шт.</p><input id="qty" class="qty" type="number" min="1" max="'+p.stock+'" value="1">','<button class="primary" style="width:100%" onclick="moveBad()">Продолжить</button><button class="secondary" style="width:100%;margin-top:8px" onclick="openCheck()">Назад</button>');
}
function moveBad(){
 const p=products[selected],q=Math.max(1,Math.min(p.stock,Number(document.getElementById('qty').value)||1));
 showModal('Переместите товар','<div class="comment">Переместите <b>'+q+' шт.</b> в блок списания по действующему процессу.</div>','<button class="primary" style="width:100%" onclick="finishBad('+q+')">Перемещение выполнено</button>');
}
function finishBad(q){products[selected].status='Решено';products[selected].tone='green';showModal('Готово','<p>Результат проверки зафиксирован. '+q+' шт. перемещены в блок списания по существующему процессу. Quality Hub отдельно остаток не пересчитывает.</p>')}
function showPickerCheck(){
 const p=products[selected]||products[0];if(pickerTimer){clearInterval(pickerTimer)}let left=7;
 showModal('Дополнительная проверка','<div class="panelSub">Заказ '+p.order+'</div><div class="productCell" style="margin-top:12px"><img class="pic" src="'+p.img+'"><div><div class="prodName">'+p.name+'</div><div class="meta">'+p.sku+'</div></div></div><div class="comment"><b>Проверьте дополнительно этот товар — по нему много жалоб</b></div><div id="pickerCountdown" class="kpiValue" style="text-align:center;margin:18px 0">7</div>','<button id="pickerConfirm" class="primary" style="width:100%;opacity:.45;cursor:not-allowed" disabled onclick="confirmPicker()">Подтвердить товар</button>');
 pickerTimer=setInterval(()=>{left--;const c=document.getElementById('pickerCountdown'),b=document.getElementById('pickerConfirm');if(c)c.textContent=left>0?left:'✓';if(left<=0){clearInterval(pickerTimer);pickerTimer=null;if(b){b.disabled=false;b.style.opacity='1';b.style.cursor='pointer'}}},1000);
}
function confirmPicker(){closeModal();showModal('Проверка подтверждена','<p>Сборщик подтвердил дополнительную проверку товара и возвращается к обычной сборке.</p>')}
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeDrawer();closeModal()}});
render();
</script>
</body>
</html>
