 return String(day).padStart(2,'0')+'.09 · '+String(hour).padStart(2,'0')+':'+mins;
}
const complaintsData=[];
let complaintSeq=0;
complaintPlan.forEach(group=>{
 for(let j=0;j<group.count;j++){
  const base=products[group.pi];
  const numericId=248391-complaintSeq*7;
  const st=complaintStatus(complaintSeq);
  complaintsData.push({
   ...base,
   _productIndex:group.pi,
   reason:group.reason,
   order:'№ '+numericId,
   sourceId:'QUALITY-'+numericId,
   sourceUrl:'https://tracker.yandex.ru/QUALITY-'+numericId,
   when:complaintTime(complaintSeq),
   text:complaintText(group.reason,base.name),
   repeat:j>0,
   status:st[0],
   tone:st[1],
   priority:st[0]==='Требует проверки'?'Срочно':st[0],
   scenario:(group.reason==='Переспелый продукт'||group.reason==='Качество продукта')?'Визуальная проверка':'Срочная проверка'
  });
  complaintSeq++;
 }
});
products.forEach((p,i)=>p.complaints=complaintsData.filter(c=>c._productIndex===i).length);

}
function reasons(){
 const rs=[
  ['Испорченный продукт','Испорченный продукт'],
  ['Переспелый / незрелый','Переспелый / незрелый'],
  ['Срок годности','Срок годности'],
  ['Повреждение упаковки','Повреждение упаковки'],
  ['Другое','Другое']
 ];
 const total=complaintsData.length;
 return '<div class="panel"><div class="panelHead"><div><div class="panelTitle">Причины жалоб</div><div class="panelSub">Нажмите на причину, чтобы увидеть обращения</div></div></div><div class="panelBody">'+rs.map(r=>{const count=complaintsData.filter(p=>reasonMatches(p,r[1])).length;const share=Math.round(count/total*100);return '<div class="reason" onclick="openReasonFilter(\''+r[1]+'\')"><span>'+r[0]+'</span><div class="bar"><i style="width:'+share+'%"></i></div><b>'+count+'</b></div>'}).join('')+'</div></div>';
}
function reasonMatches(p,f){
 if(f==='Все причины')return true;
 if(f==='Переспелый / незрелый')return p.reason==='Переспелый продукт'||p.reason==='Незрелый продукт';
 if(f==='Повреждение упаковки')return p.reason==='Повреждена упаковка';
 if(f==='Другое')return !['Испорченный продукт','Срок годности','Переспелый продукт','Незрелый продукт','Повреждена упаковка'].includes(p.reason);
 return p.reason===f;
}
function openReasonFilter(reason){
 complaintReason=reason;
 complaintFilter='Все';
 complaintQuery='';
 tab='Жалобы';
 render();
}
function filteredComplaints(){
 const q=complaintQuery.trim().toLowerCase();
 return complaintsData.map((p,i)=>({p,i})).filter(x=>{
  const p=x.p;
  const statusOk=complaintFilter==='Все'||(complaintFilter==='Требуют проверки'&&p.status==='Требует проверки')||(complaintFilter==='Открытые'&&p.status!=='Решено')||(complaintFilter==='Повторные'&&p.repeat);
  const reasonOk=reasonMatches(p,complaintReason);
  return statusOk&&reasonOk&&(!q||(p.name+' '+p.sku+' '+p.order+' '+p.reason+' '+p.sourceId).toLowerCase().includes(q));
 });
}
function complaints(){
 const rows=filteredComplaints(),filters=['Все','Требуют проверки','Открытые','Повторные'];
 const reasonsList=['Все причины','Испорченный продукт','Переспелый / незрелый','Срок годности','Повреждение упаковки','Другое'];
 return '<div class="panel"><div class="panelHead"><div><div class="panelTitle">Жалобы по качеству</div><div class="panelSub">'+rows.length+' обращений · выберите строку, чтобы посмотреть детали</div></div><div class="toolbar">'+filters.map(f=>'<button class="segment '+(complaintFilter===f?'on':'')+'" onclick="complaintFilter=\''+f+'\';render()">'+f+'</button>').join('')+'<select class="filterSelect" onchange="complaintReason=this.value;render()">'+reasonsList.map(r=>'<option '+(complaintReason===r?'selected':'')+'>'+r+'</option>').join('')+'</select><input class="searchInput" placeholder="Товар, SKU, заказ или ID жалобы" value="'+complaintQuery.replace(/"/g,'&quot;')+'" onkeydown="if(event.key===\'Enter\'){complaintQuery=this.value;render()}" onblur="complaintQuery=this.value"></div></div><div class="tableWrap"><table class="tbl"><thead><tr><th>ТОВАР</th><th>ПРИЧИНА</th><th>ИСТОЧНИК</th><th>СТАТУС</th><th>ДАТА</th><th></th></tr></thead><tbody>'+rows.map(x=>{const p=x.p,i=x.i;return '<tr onclick="openDrawer('+i+',\'complaints\')"><td><div class="productCell"><img class="pic" src="'+p.img+'"><div><div class="prodName">'+p.name+'</div><div class="meta"><span>'+p.sku+'</span><span>•</span><span>'+p.order+'</span>'+(p.repeat?'<span class="badge red">повтор</span>':'')+'</div></div></div></td><td>'+p.reason+'<div class="meta">'+p.scenario+'</div></td><td><a class="source" href="'+p.sourceUrl+'" target="_blank" rel="noopener" onclick="event.stopPropagation()">'+p.sourceId+' ↗</a></td><td><span class="badge '+p.tone+'">'+p.status+'</span></td><td>'+p.when+'</td><td class="chev">›</td></tr>'}).join('')+(rows.length?'':'<tr><td colspan="6" class="empty">По выбранным фильтрам жалоб нет</td></tr>')+'</tbody></table></div></div>';
}
function filteredProducts(){
 const q=productQuery.trim().toLowerCase();
 return products.map((p,i)=>({p,i})).filter(x=>{
  const p=x.p;
  const ok=productFilter==='Все'||(productFilter==='С жалобами'&&p.complaints>0)||(productFilter==='Требуют проверки'&&p.status==='Требует проверки')||(productFilter==='Повторные'&&p.repeat);
  return ok&&(!q||(p.name+' '+p.sku).toLowerCase().includes(q));
 });
}
function productsView(){
 const rows=filteredProducts(),filters=['Все','С жалобами','Требуют проверки','Повторные'];
 return '<div class="panel"><div class="panelHead"><div><div class="panelTitle">Товары</div><div class="panelSub">SKU с жалобами и актуальным статусом качества</div></div><div class="toolbar">'+filters.map(f=>'<button class="segment '+(productFilter===f?'on':'')+'" onclick="productFilter=\''+f+'\';render()">'+f+'</button>').join('')+'<input class="searchInput" placeholder="SKU или товар" value="'+productQuery.replace(/"/g,'&quot;')+'" onkeydown="if(event.key===\'Enter\'){productQuery=this.value;render()}" onblur="productQuery=this.value"></div></div><div class="panelBody"><div class="productGrid">'+rows.map(x=>{const p=x.p,i=x.i;return '<div class="productCard" onclick="openDrawer('+i+')"><div class="productCardTop"><img class="productCardImg" src="'+p.img+'"><div style="min-width:0;flex:1"><div class="prodName">'+p.name+'</div><div class="meta">'+p.sku+' • '+p.order+'</div><div style="margin-top:8px"><span class="badge '+p.tone+'">'+p.status+'</span>'+(p.repeat?'<span class="badge red" style="margin-left:6px">повтор</span>':'')+'</div></div></div><div class="productStats"><div class="productStat"><span>Жалобы</span><b>'+p.complaints+'</b></div><div class="productStat"><span>Остаток</span><b>'+p.stock+' шт.</b></div><div class="productStat"><span>Причина</span><b>'+p.reason+'</b></div></div></div>'}).join('')+'</div></div></div>';
}
function reasonsView(){
 const groups=[
  {name:'Испорченный продукт',note:'Потенциально критичный сигнал'},
  {name:'Переспелый / незрелый',note:'Визуальная проверка'},
  {name:'Срок годности',note:'Проверка срока и партии'},
  {name:'Повреждение упаковки',note:'Проверка целостности'},
  {name:'Другое',note:'Разбор по кейсу'}
 ];
 return '<div class="grid2"><div class="panel"><div class="panelHead"><div><div class="panelTitle">Причины жалоб</div><div class="panelSub">Количество на плитке всегда равно количеству открываемых жалоб</div></div></div><div class="panelBody"><div class="reasonCards">'+groups.map(g=>{const matches=complaintsData.map((p,i)=>({p,i})).filter(x=>reasonMatches(x.p,g.name));const count=matches.length;const share=Math.round(count/complaintsData.length*100);const examples=matches.slice(0,3);return '<div class="reasonCard" onclick="openReasonFilter(\''+g.name+'\')"><div class="reasonCardTop"><div><b>'+g.name+'</b><div class="panelSub">'+g.note+'</div></div><div style="text-align:right"><div class="reasonCount">'+count+'</div><div class="panelSub">'+share+'%</div></div></div><div class="reasonVisuals">'+(examples.length?examples.map(x=>'<img src="'+x.p.img+'" alt="">').join(''):'<div class="panelSub">Нет обращений</div>')+'</div><div class="reasonFooter"><span class="panelSub">'+(examples.length?examples.map(x=>x.p.sourceId).join(' · '):'')+'</span><span class="reasonLink">Показать '+count+' жалоб →</span></div></div>'}).join('')+'</div></div></div><div class="panel"><div class="panelHead"><div><div class="panelTitle">Как читать этот раздел</div><div class="panelSub">Быстрый разбор для директора Лавки</div></div></div><div class="panelBody"><div class="step"><span class="stepNo">1</span><div><b>Сначала причина</b><div class="panelSub">Сразу виден масштаб проблемы и примеры товаров.</div></div></div><div class="step"><span class="stepNo">2</span><div><b>Потом конкретные жалобы</b><div class="panelSub">Клик открывает список уже с нужным фильтром.</div></div></div><div class="step"><span class="stepNo">3</span><div><b>В карточке — весь контекст</b><div class="panelSub">Фото, комментарий, SKU, остаток и исходная жалоба.</div></div></div></div></div></div>';
}
function dynamicsView(){
 const repeat=products.filter(p=>p.repeat).slice(0,4);
 return kpis()+'<div class="grid2">'+chart()+'<div class="panel"><div class="panelHead"><div><div class="panelTitle">Повторные жалобы</div><div class="panelSub">Товары, которые требуют внимания</div></div></div><div class="panelBody"><div class="trendList">'+repeat.map((p,i)=>'<div class="trendRow" onclick="openDrawer('+products.indexOf(p)+')" style="cursor:pointer"><img class="pic" src="'+p.img+'"><div><div class="prodName">'+p.name+'</div><div class="meta">'+p.reason+'</div></div><div class="trendBar"><i style="width:'+(90-i*16)+'%"></i></div><b>'+p.complaints+'</b></div>').join('')+'</div><div class="visualHint" style="margin-top:12px"><span class="badge red">17</span><span>обращений после первого сигнала в анализируемой выборке</span></div></div></div></div>';
}
function actionsView(){
 const ids=[0,1,2,3];
 return '<div class="panel"><div class="panelHead"><div><div class="panelTitle">Действия по качеству</div><div class="panelSub">Позиции, где сейчас нужна реакция Лавки</div></div><div class="toolbar"><span class="badge red">2 срочно</span><span class="badge amber">1 в работе</span><span class="badge blue">1 новая</span></div></div><div class="panelBody"><div class="productGrid">'+ids.map(i=>{const p=products[i];return '<div class="actionCard" onclick="openDrawer('+i+')" style="cursor:pointer"><div class="actionCardVisual"><img class="actionImage" src="'+p.img+'"><div><div class="actionPrimaryLine"><div class="prodName">'+p.name+'</div><span class="badge '+p.tone+'">'+p.priority+'</span></div><div class="meta">'+p.sku+' • '+p.order+'</div><div class="actionReason">'+p.reason+' · '+p.scenario+'</div></div></div><div class="actionDivider"></div><div class="meta"><span>Остаток '+p.stock+' шт.</span>'+(p.repeat?'<span>•</span><span class="bad">повторная жалоба</span>':'')+'</div><div class="actionBtns"><button class="primary" onclick="event.stopPropagation();selected='+i+';openCheck()">Проверить товар</button><a class="source" href="'+p.sourceUrl+'" target="_blank" rel="noopener" onclick="event.stopPropagation()">Жалоба ↗</a></div></div>'}).join('')+'</div></div></div>';

function overview(){
 const urgent=products.filter(p=>p.status==='Требует проверки').slice(0,2);
 const attention='<div class="attentionGrid">'+urgent.map(p=>{const i=products.indexOf(p);return '<div class="attentionCard" onclick="openDrawer('+i+')"><div class="attentionMain"><img class="pic lg" src="'+p.img+'"><div class="attentionInfo"><div class="attentionTitle">'+p.name+'</div><div class="attentionMeta">'+p.reason+' · '+p.complaints+' жалобы</div><div style="margin-top:7px"><span class="badge red">Нужно проверить</span></div></div></div><div class="attentionAction"><span class="panelSub">'+p.stock+' шт.</span><span class="attentionArrow">›</span></div></div>'}).join('')+'</div>';
 return kpis()+attention+'<div class="principle"><b>Первая жалоба</b><span class="arrow">→</span><span>сигнал в WMS</span><span class="arrow">→</span><span>проверка конкретного SKU</span><span class="arrow">→</span><span>меньше повторных обращений</span></div><div class="grid2" style="margin-bottom:14px">'+chart()+reasons()+'</div>'+complaints();
}

 let body=tab==='Обзор'?overview():tab==='Жалобы'?complaints():tab==='Товары'?productsView():tab==='Причины'?reasonsView():tab==='Динамика'?dynamicsView():actionsView();

function openDrawer(i,source='products'){
 const p=source==='complaints'?complaintsData[i]:products[i];
 selected=p._productIndex!==undefined?p._productIndex:i;
 currentDrawerItem=p;
 drawer.innerHTML='<div class="drawerHead"><div><div class="panelSub">'+p.sourceId+'</div><h2>'+p.name+'</h2><div class="meta">'+p.sku+' • '+p.order+'</div></div><button class="closeBtn" onclick="closeDrawer()">×</button></div><div class="drawerBody"><div style="display:flex;gap:7px;flex-wrap:wrap"><span class="badge '+p.tone+'">'+p.status+'</span>'+(p.repeat?'<span class="badge red">Повторная</span>':'')+'</div><div class="factGrid"><div class="fact"><span>Причина</span><b>'+p.reason+'</b></div><div class="fact"><span>Сценарий</span><b>'+p.scenario+'</b></div><div class="fact"><span>Остаток</span><b>'+p.stock+' шт.</b></div><div class="fact"><span>Ячейка</span><b>'+p.cell+'</b></div></div><div class="sectionLabel">Заказ</div><div class="orderPeople"><div class="personCard"><span>Сборщик</span><b>'+p.picker+'</b><div class="meta">Собрано в '+p.pickedAt+'</div></div><div class="personCard"><span>Курьер</span><b>'+p.courier+'</b><div class="meta">Доставлено в '+p.deliveredAt+'</div></div></div><div class="orderQuick"><button class="secondary" onclick="showOrderLogs()">Логи заказа</button><button class="secondary" onclick="showOrderInfo()">Детали заказа</button></div><div class="photoLabel">Фото из жалобы</div><img class="complaintPhoto" src="'+p.img+'"><div class="comment"><b>Комментарий покупателя</b><br>'+p.text+'</div><div class="panelSub" style="margin-top:12px">'+(p.hold?'Quality Hold применяется только к этому SKU до проверки.':'Автоматического Hold нет — нужна визуальная проверка конкретной позиции.')+'</div><div class="drawerActions"><button class="primary" onclick="closeDrawer();openCheck()">Проверить товар</button><a class="secondary" style="text-decoration:none;text-align:center" href="'+p.sourceUrl+'" target="_blank" rel="noopener">Открыть исходную жалобу ↗</a></div></div>';
 drawerBg.classList.add('open');document.body.style.overflow='hidden';
}
function showOrderInfo(){
 const p=currentDrawerItem||products[selected];
 showModal('Детали заказа '+p.order,'<div class="factGrid"><div class="fact"><span>Сборщик</span><b>'+p.picker+'</b></div><div class="fact"><span>Курьер</span><b>'+p.courier+'</b></div><div class="fact"><span>Собрано</span><b>'+p.pickedAt+'</b></div><div class="fact"><span>Доставлено</span><b>'+p.deliveredAt+'</b></div><div class="fact"><span>SKU</span><b>'+p.sku+'</b></div><div class="fact"><span>Ячейка</span><b>'+p.cell+'</b></div></div><div class="comment"><b>Контекст жалобы</b><br>'+p.reason+' · '+p.text+'</div>');
}
function showOrderLogs(){
 const p=currentDrawerItem||products[selected];
 const logs=[
  ['17:41','Заказ создан','Заказ принят системой'],
  ['17:46','Передан в сборку','Назначен сборщик '+p.picker],
  [p.pickedAt,'Сборка завершена',p.name+' добавлен в заказ'],
  ['18:07','Передан курьеру','Назначен курьер '+p.courier],
  [p.deliveredAt,'Заказ доставлен','Клиент получил заказ'],
  [p.when.split(' · ')[1]||p.when,'Получена жалоба',p.sourceId+' · '+p.reason]
 ];

}
function closeDrawer(){drawerBg.classList.remove('open');document.body.style.overflow=''}
function showStore(){showModal('Лавка 312 · Митино','<p>ул. Митинская, 36</p>')}
function showDate(){showModal('Дата','<p>Выбран период: <b>21.09.2026</b></p>')}
function globalLookup(v){
 const q=(v||'').trim().toLowerCase();if(!q)return;
 const i=products.findIndex(p=>(p.name+' '+p.sku+' '+p.order).toLowerCase().includes(q));
 if(i>=0){tab='Жалобы';render();openDrawer(i)} else showModal('Поиск','<p>Ничего не найдено.</p>');

function showModal(title,body,actions){
 modal.style.display='flex';modalBody.innerHTML='<h2>'+title+'</h2>'+body+(actions||'<button class="primary" style="width:100%;margin-top:12px" onclick="closeModal()">Закрыть</button>');

function closeModal(){modal.style.display='none'}
modal.onclick=e=>{if(e.target===modal)closeModal()};
function openCheck(){
 const p=products[selected];
 showModal('Проверка товара','<div class="productCell"><img class="pic" src="'+p.img+'"><div><div class="prodName">'+p.name+'</div><div class="meta">'+p.sku+' • '+p.scenario+'</div></div></div><div class="comment">'+p.text+'</div><p>Проверьте конкретный товар и выберите результат.</p><div class="choice"><button class="secondary" onclick="good()">С товаром всё в норме</button><button class="danger" onclick="bad()">Товар плохого качества</button></div>');

function good(){products[selected].status='Решено';products[selected].tone='green';showModal('Проверка завершена','<p>Товар в норме. Остатки не изменяются, пересчёт не требуется.</p>')}
function bad(){
 const p=products[selected];showModal('Сколько единиц плохого качества?','<p>'+p.name+' · текущий остаток '+p.stock+' шт.</p><input id="qty" class="qty" type="number" min="1" max="'+p.stock+'" value="1">','<button class="primary" style="width:100%" onclick="moveBad()">Продолжить</button><button class="secondary" style="width:100%;margin-top:8px" onclick="openCheck()">Назад</button>');

 const p=products[selected],q=Math.max(1,Math.min(p.stock,Number(document.getElementById('qty').value)||1));
 showModal('Переместите товар','<div class="comment">Переместите <b>'+q+' шт.</b> в блок списания по действующему процессу.</div>','<button class="primary" style="width:100%" onclick="finishBad('+q+')">Перемещение выполнено</button>');
}
function finishBad(q){products[selected].status='Решено';products[selected].tone='green';showModal('Готово','<p>Результат проверки зафиксирован. '+q+' шт. перемещены в блок списания по существующему процессу. Quality Hub отдельно остаток не пересчитывает.</p>')}
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeDrawer();closeModal()}});
render();
</script>
