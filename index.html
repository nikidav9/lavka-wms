function navRender(){

  ['Основное',['Общая информация','Диспетчерская','Операции','Остатки','Качество']],
  ['Команда и склад',['Мой ассортимент','Мои сотрудники','Области хранения','Оборудование склада','Задания']],

 ];
 var byName={};navItems.forEach(function(x){byName[x[0]]=x[1]});
 var html='';
 groups.forEach(function(g){
   html+='<div class="navGroupTitle">'+g[0]+'</div>';
   g[1].forEach(function(n){var i=byName[n]||'·';html+='<div class="navItem '+(currentSection===n?'active':'')+'" data-section="'+n+'"><span class="ico">'+i+'</span><span class="navLabel">'+n+'</span>'+(n==='Качество'?'<span class="navBadge">4</span>':'')+'</div>'});
 });
 document.getElementById('nav').innerHTML=html;
 document.querySelectorAll('.navItem,.subItem').forEach(function(el){
   el.onclick=function(){currentSection=el.dataset.section;document.querySelectorAll('.subItem').forEach(function(x){x.classList.remove('active')});if(el.classList.contains('subItem'))el.classList.add('active');render();closeSidebar()};
 });
}

function toggleKitchen(){document.getElementById('kitchen').classList.toggle('open')}
function openSidebar(){sidebarEl.classList.add('open');overlayEl.classList.add('on')}
function closeSidebar(){sidebarEl.classList.remove('open');overlayEl.classList.remove('on')}

function showModal(title,body,actions){
 modalEl.style.display='flex';
 modalBodyEl.innerHTML='<h2>'+title+'</h2>'+body+(actions||'<button class="primary full" onclick="closeModal()">Закрыть</button>');
}
function closeModal(){modalEl.style.display='none';if(pickerTimer){clearInterval(pickerTimer);pickerTimer=null}}
modalEl.onclick=function(e){if(e.target===modalEl)closeModal()};

function showHelp(){
 showModal('Помощь по WMS','<p>Это интерактивный прототип. Выберите раздел в меню, а внутри «Качества» используйте вкладки, фильтры, строки таблиц и действия по товару.</p>');
}

 showModal('Уведомления','<div class="stack"><div class="card sectionCard"><b>4 товара требуют проверки</b><div class="small">Quality Hub · сейчас</div></div><div class="card sectionCard"><b>2 задания близки к SLA</b><div class="small">Задания · 5 минут назад</div></div></div>');

function setGenericFilter(f){genericFilter=f;render()}
function showGenericMetric(title,value){showModal(title,'<p>Текущее значение: <b>'+value+'</b>.</p><p class="small">Демо-данные интерактивного прототипа.</p>')}
function showGenericItem(name,status){showModal(name,'<div class="kv"><span>Статус</span><b>'+status+'</b></div><div class="kv"><span>Обновлено</span><b>Только что</b></div><div class="kv"><span>Ответственный</span><b>Директор лавки</b></div>')}

function generic(name){
 var d=genericPages[name]||[name,[['Активно','—'],['Сегодня','—'],['Статус','Работает']],'Раздел WMS'];
 var metrics=d[1].map(function(m,i){return '<div class="card kpi clickableCard" onclick="showGenericMetric(\''+m[0].replace(/'/g,'')+'\',\''+m[1].replace(/'/g,'')+'\')"><div class="kpiLabel">'+m[0]+'</div><div class="kpiValue">'+m[1]+'</div><div class="small">'+(i===2?'текущий статус':'за текущую смену')+'</div></div>'}).join('');
 var rows=genericFilter==='Сегодня'?
 [['Основной поток','Работает','Только что','Директор лавки'],['Контрольная задача','В работе','5 минут назад','Сотрудник смены'],['Системная проверка','Запланировано','Сегодня','WMS']]:
 [['Основной поток','Работает','Только что','Директор лавки'],['Контрольная задача','В работе','5 минут назад','Сотрудник смены'],['Системная проверка','Запланировано','Сегодня','WMS'],['Архивная задача','Завершено','Вчера','Сотрудник смены']];
 return pageHeader(d[0])+'<div class="kpis">'+metrics+'<div class="card kpi clickableCard" onclick="chooseStore()"><div class="kpiLabel">Лавка</div><div class="kpiValue" style="font-size:19px;margin-top:10px">312</div><div class="small">Митино</div></div></div><div class="panel"><div class="panelHead"><span class="panelTitle">'+d[0]+'</span><div class="toolbar"><button class="pill '+(genericFilter==='Сегодня'?'on':'')+'" onclick="setGenericFilter(\'Сегодня\')">Сегодня</button><button class="pill '+(genericFilter==='Все'?'on':'')+'" onclick="setGenericFilter(\'Все\')">Все</button></div></div><div class="panelBody"><h3 style="margin-top:0">'+d[2]+'</h3><div class="tableWrap"><table class="tbl"><thead><tr><th>ОБЪЕКТ</th><th>СТАТУС</th><th>ОБНОВЛЕНО</th><th>ОТВЕТСТВЕННЫЙ</th></tr></thead><tbody>'+rows.map(function(r){var tone=r[1]==='Работает'||r[1]==='Завершено'?'green':r[1]==='В работе'?'amber':'blue';return '<tr onclick="showGenericItem(\''+r[0]+'\',\''+r[1]+'\')"><td>'+r[0]+'</td><td><span class="tag '+tone+'">'+r[1]+'</span></td><td>'+r[2]+'</td><td>'+r[3]+'</td></tr>'}).join('')+'</tbody></table></div></div></div>';
}

function render(){pageEl.innerHTML=currentSection==='Качество'?quality():generic(currentSection);navRender()}

function showPickerCheck(){
 var p=products[selected]||products[0];
 if(pickerTimer){clearInterval(pickerTimer);pickerTimer=null}
 var left=7;
 modalEl.style.display='flex';
 modalBodyEl.innerHTML='<h2>Дополнительная проверка</h2><div class="small" style="margin-bottom:12px">Заказ '+p.order+'</div><div class="prod"><img class="pic" src="'+p.img+'"><div><div class="prodName">'+p.name+'</div><div class="small">'+p.sku+'</div></div></div><div class="comment" style="font-size:14px;margin-top:16px"><b>Проверьте дополнительно этот товар — по нему много жалоб</b></div><div id="pickerCountdown" class="kpiValue" style="text-align:center;margin:18px 0 8px">7</div><button id="pickerConfirm" class="primary full" disabled style="opacity:.45;cursor:not-allowed" onclick="confirmPicker()">Подтвердить товар</button>';
 pickerTimer=setInterval(function(){
   left-=1;
   var counter=document.getElementById('pickerCountdown');
   var btn=document.getElementById('pickerConfirm');
   if(counter)counter.textContent=left>0?String(left):'✓';
   if(left<=0){
     clearInterval(pickerTimer);pickerTimer=null;
     if(btn){btn.disabled=false;btn.style.opacity='1';btn.style.cursor='pointer'}
   }
 },1000);
}
function confirmPicker(){closeModal();showModal('Проверка подтверждена','<p>Сборщик подтвердил дополнительную проверку товара и возвращается к обычной сборке.</p>')}
function openCheck(){
 var p=products[selected];
 modalEl.style.display='flex';
 modalBodyEl.innerHTML='<h2>Проверка товара</h2><div class="prod"><img class="pic" src="'+p.img+'"><div><div class="prodName">'+p.name+'</div><div class="small">'+p.sku+' · '+p.scenario+'</div></div></div><div class="comment">'+p.text+'</div><div class="holdNote">'+(p.hold?'На время проверки Hold действует только для этого SKU.':'Автоматический Hold не нужен — выполните визуальную проверку.')+'</div><p>Проверьте конкретный товар и выберите результат.</p><div class="choice"><button onclick="good()">С товаром всё в норме</button><button class="danger" onclick="bad()">Товар плохого качества</button></div><button class="secondary full" onclick="closeModal()">Отмена</button>';
}
function good(){
 products[selected].status='Решено';
 products[selected].tone='green';
 modalBodyEl.innerHTML='<h2>Проверка завершена</h2><p>Товар в норме. Остатки не изменяются, пересчёт не требуется.</p><button class="primary full" onclick="closeModal();render()">Готово</button>';
}
function bad(){
 var p=products[selected];
 modalBodyEl.innerHTML='<h2>Сколько единиц плохого качества?</h2><p>'+p.name+' · текущий остаток '+p.stock+' шт.</p><input id="qty" class="qty" type="number" min="1" max="'+p.stock+'" value="1"><button class="primary full" onclick="moveBad()">Продолжить</button><button class="secondary full" onclick="openCheck()">Назад</button>';
}
function moveBad(){
 var p=products[selected];
 var input=document.getElementById('qty');
 var q=Math.max(1,Math.min(p.stock,Number(input.value)||1));
 modalBodyEl.innerHTML='<h2>Переместите товар</h2><div class="comment">Переместите <b>'+q+' шт.</b> в блок списания по действующему процессу.</div><p>После перемещения подтвердите выполнение.</p><button class="primary full" onclick="finishBad('+q+')">Перемещение выполнено</button>';
}
function finishBad(q){
 products[selected].status='Решено';
 products[selected].tone='green';
 modalBodyEl.innerHTML='<h2>Готово</h2><p>Результат проверки зафиксирован. '+q+' шт. перемещены в блок списания по существующему процессу. Quality Hub отдельно остаток не пересчитывает.</p><button class="primary full" onclick="closeModal();render()">Закрыть</button>';
}

document.addEventListener('keydown',function(e){
 if(e.key==='Escape'){closeComplaintDrawer();closeModal();closeSidebar()}
});
render();
</script>
</body></html>
